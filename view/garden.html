<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peers · garden</title>
<style>
:root{--hud-bg:#fbf9f2e6;--hud-fg:#2b2722;--hud-dim:#6f7660;--hud-line:#dfe0cc;--hud-alert:#e8622c;--hud-font:ui-sans-serif,-apple-system,"Segoe UI",sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#e9eedb}
canvas{display:block}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import { createSim, REPOS, files } from './sim.js'
import { createHud } from './hud.js'
import { THREE, stage, clay, box, bean, walk, goTo, flights, arc, ease, textPlane, sunlight, pose } from './kit.js'

const sim = createSim()
const hud = createHud(sim, { title: 'peers · garden' })
const S = stage({ bg: '#e9eedb', span: innerWidth < innerHeight ? 31 : 25 })
const { scene } = S
const fly = flights(scene, S.onFrame)
const ALERT = '#e8622c'
sunlight(scene, { sky: '#fbfff0', ground: '#c9c79f' })

// lawn, plots per repo, barn "main" in the middle
const lawn = new THREE.Mesh(new THREE.CylinderGeometry(15.5, 15.8, 0.6, 64), clay('#bccf95'))
lawn.position.y = -0.3; lawn.receiveShadow = true; scene.add(lawn)
const PLOT = { wren: [-6, -6, 9.6, 8.2], peers: [6, -6, 8, 6], vireo: [-6, 6, 8, 6], engine: [6, 6, 8, 6] }
const soilM = clay('#a7825f'), rowM = clay('#946f4f'), postM = clay('#b79b74')
const SPOT = {}
for (const r of REPOS) {
  const [x, z, w, d] = PLOT[r.id]
  const soil = box(w, 0.3, d, soilM); soil.position.set(x, 0.1, z); scene.add(soil)
  // fence posts on the corners
  for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { const p = box(0.22, 0.9, 0.22, postM); p.position.set(x + (sx * w) / 2, 0.45, z + (sz * d) / 2); scene.add(p) }
  const sign = textPlane(r.id, { color: '#3f4d2a', w: 5, size: 80, weight: 700 }); sign.position.set(x - w / 2 + 2.4, 0.02, z + d / 2 + 0.85); scene.add(sign)
  const fs = files(r.id), cols = Math.ceil(Math.sqrt(fs.length * (w / d)))
  const rows = Math.ceil(fs.length / cols)
  fs.forEach((f, i) => {
    const cx = x - w / 2 + (w / cols) * ((i % cols) + 0.5), cz = z - d / 2 + (d / rows) * (Math.floor(i / cols) + 0.4)
    const mound = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), rowM)
    mound.scale.y = 0.5; mound.position.set(cx, 0.25, cz); mound.receiveShadow = true; scene.add(mound)
    const plant = new THREE.Group(); plant.position.set(cx, 0.3, cz); scene.add(plant)
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 1, 8), clay('#6f9a4e')); stem.castShadow = true; plant.add(stem)
    const leafM = clay('#86b35c')
    const leaves = [-1, 1].map((s) => { const l = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 8), leafM); l.scale.set(1.3, 0.35, 0.7); l.position.x = s * 0.2; l.rotation.z = s * 0.4; l.castShadow = true; plant.add(l); return l })
    const bloom = new THREE.Mesh(new THREE.IcosahedronGeometry(0.3, 1), clay('#fff6e6', { flatShading: true })); bloom.castShadow = true; plant.add(bloom)
    const fl = textPlane(f.split('/').pop(), { color: '#fbf3e4', w: 2.5, size: 64, weight: 700, font: 'ui-monospace,Menlo,monospace' }); fl.position.set(cx + 0.15, 0.27, cz + 0.85); scene.add(fl)
    SPOT[`${r.id}/${f}`] = { x: cx, z: cz, plant, stem, leaves, bloom, h: 0.2, flash: 0, shake: 0 }
  })
}
const barn = new THREE.Group()
const walls = box(2.4, 1.6, 2, clay('#c8644a')); walls.position.y = 0.8; barn.add(walls)
for (const sx of [-1, 1]) { const rf = box(1.6, 0.14, 2.3, clay('#f1e7d5')); rf.position.set(sx * 0.62, 2.0, 0); rf.rotation.z = -sx * 0.62; barn.add(rf) }
const gable = box(2.2, 0.8, 1.9, clay('#c8644a')); gable.scale.set(0.6, 1, 1); gable.position.y = 1.85; barn.add(gable)
const door = box(0.9, 1.1, 0.05, clay('#f1e7d5')); door.position.set(0, 0.55, 1.01); barn.add(door)
const crate = box(0.9, 0.5, 0.7, clay('#c9a46f')); crate.position.set(1.7, 0.25, 1.2); barn.add(crate)
barn.rotation.y = Math.PI / 4; scene.add(barn)
const mainL = textPlane('main', { color: '#5a6b3e', w: 2.4 }); mainL.position.set(0.3, 0.02, 2.4); scene.add(mainL)
const BENCH = [[-1.9, 2.6], [2.6, -1.9]]
for (const [x, z] of BENCH) { const b = box(2, 0.35, 0.6, clay('#b79b74')); b.position.set(x, 0.35, z); b.lookAt(0, 0.35, 0); scene.add(b) }
// trees on the rim
for (let i = 0; i < 9; i++) {
  const a = (i / 9) * Math.PI * 2 + 0.3, t = new THREE.Group()
  const trunk = box(0.3, 1, 0.3, clay('#8a6a4c')); trunk.position.y = 0.5; t.add(trunk)
  const top = new THREE.Mesh(new THREE.IcosahedronGeometry(0.9, 0), clay('#7fa65a', { flatShading: true })); top.position.y = 1.5; top.castShadow = true; t.add(top)
  t.position.set(Math.cos(a) * 14, 0, Math.sin(a) * 14); scene.add(t)
}

// plant height = lines held; bloom = holder colour; focus blooms open
function grow() {
  const holder = {}
  for (const x of sim.sessions) for (const [f, n] of x.holds) holder[`${x.repo}/${f}`] = [x, n]
  for (const k in SPOT) {
    const s = SPOT[k], [x, n] = holder[k] || []
    s.h = x ? Math.min(0.7 + n / 22, 3) : 0.2
    if (x) s.bloom.material.color.set(x.color)
    s.bloom.visible = !!x
    s.focus = !!x && x.focus === k.slice(k.indexOf('/') + 1)
  }
}
grow()

const W = {}
const slot = {}
for (const x of sim.sessions) {
  const i = (slot[x.repo] = (slot[x.repo] ?? -1) + 1)
  const [px, pz, pw, pd] = PLOT[x.repo]
  const b = bean(x.color); b.scale.setScalar(1.25)
  const first = [...x.holds.keys()][0]
  const sp = first ? SPOT[`${x.repo}/${first}`] : null
  const gate = new THREE.Vector3(px + (i ? 1.2 : -1.2), 0, pz + pd / 2 + 1.2)
  b.position.set(sp ? sp.x + 0.75 : gate.x, 0, sp ? sp.z + 0.4 : gate.z); scene.add(b)
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.6, 0.78, 40), new THREE.MeshBasicMaterial({ color: ALERT, transparent: true, opacity: 0 })); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.06; b.add(ring)
  const flag = new THREE.Group(); const pole = box(0.05, 1.6, 0.05, clay('#6b5a44')); pole.position.y = 0.8; flag.add(pole)
  const cloth = box(0.6, 0.38, 0.03, clay(ALERT, { emissive: ALERT, emissiveIntensity: 0.4 })); cloth.position.set(0.3, 1.38, 0); flag.add(cloth)
  flag.visible = false; scene.add(flag)
  W[x.id] = { x, b, ring, flag, gate, bench: BENCH[i % 2], errand: false, spot: sp }
}
const head = (w) => w.b.position.clone().add(new THREE.Vector3(0, 1.75, 0))
const stand = (w, s) => { w.spot = s; goTo(w.b, s.x + 0.75, s.z + 0.4, () => (w.b.rotation.y = -Math.PI / 2)) }

let barnHit = 0
sim.on((e) => {
  const w = W[e.who] || W[e.from]
  if ((e.type === 'edit' || e.type === 'take') && !w.errand) { const s = SPOT[`${e.repo}/${e.file}`]; stand(w, s); s.bump = 1 }
  if (e.type === 'commit') {
    // harvest: blooms leave the plants, bean walks a basket to the barn
    w.errand = true
    const basket = box(0.6, 0.35, 0.45, clay('#c9a46f')); basket.position.set(0, 1.35, 0.45); w.b.add(basket)
    for (const f of e.files) { const s = SPOT[`${e.repo}/${f}`]; if (s) s.shake = 0.5 }
    goTo(w.b, Math.sign(w.gate.x) * 1.8, Math.sign(w.gate.z) * 1.8, () => {
      w.b.remove(basket); barnHit = 1
      goTo(w.b, w.gate.x, w.gate.z, () => (w.errand = false))
    })
  }
  if (e.type === 'state' && e.state === 'idle' && !w.errand) goTo(w.b, w.bench[0] * 1.15, w.bench[1] * 1.15)
  if (e.type === 'clash') { const s = SPOT[`${e.repo}/${e.file}`]; if (s) { s.flash = 2.4; s.shake = 1.2 } }
  if (e.type === 'msg') {
    const to = W[e.to]
    const bird = new THREE.Group()
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.18, 10, 8), clay('#fffdf8')); bird.add(body)
    const wings = [-1, 1].map((s) => { const wg = box(0.4, 0.03, 0.18, clay('#fffdf8')); wg.position.x = s * 0.22; bird.add(wg); return wg })
    const a = head(w), b = head(to)
    fly(bird, 1.5, (k, o) => { const p = arc(a, b, ease(k), 3); o.position.copy(p); o.lookAt(arc(a, b, Math.min(ease(k) + 0.02, 1), 3)); wings.forEach((wg, i) => (wg.rotation.z = (i ? -1 : 1) * Math.sin(k * 40) * 0.7)) })
  }
  grow()
})

S.onFrame((dt, t) => {
  barnHit = Math.max(0, barnHit - dt * 1.5)
  barn.scale.setScalar(1 + Math.sin(barnHit * Math.PI) * 0.08)
  for (const k in SPOT) {
    const s = SPOT[k]
    const cur = s.stem.scale.y
    const h = cur + (s.h - cur) * Math.min(1, dt * 3)
    s.stem.scale.y = h; s.stem.position.y = h / 2
    s.leaves.forEach((l, i) => (l.position.y = h * (0.35 + i * 0.2)))
    s.bump = Math.max(0, (s.bump || 0) - dt * 2)
    s.bloom.position.y = h + 0.1
    s.bloom.scale.setScalar((s.focus ? 1.9 : 1.35) * (1 + Math.sin(s.bump * Math.PI) * 0.35))
    s.bloom.rotation.y += dt * (s.focus ? 1.5 : 0.2)
    if (s.shake > 0) { s.shake -= dt; s.plant.rotation.z = Math.sin(t * 40) * 0.15 * s.shake } else s.plant.rotation.z = 0
    if (s.flash > 0) { s.flash -= dt; s.bloom.material.emissive.set(s.flash > 0 && Math.sin(t * 16) > 0 ? ALERT : '#000') } else s.bloom.material.emissive.set('#000')
  }
  for (const w of Object.values(W)) {
    const { x, b } = w
    const moving = walk(b, dt)
    pose(b, x, t, moving, !moving && w.spot && Math.hypot(b.position.x - w.spot.x - 0.75, b.position.z - w.spot.z - 0.4) < 0.1)
    w.ring.material.opacity = x.state === 'blocked' ? 0.55 + Math.sin(t * 6) * 0.35 : 0
    w.flag.visible = x.state === 'blocked'
    if (w.flag.visible) { w.flag.position.set(b.position.x - 0.7, 0, b.position.z - 0.3); w.flag.children[1].rotation.y = Math.sin(t * 5) * 0.3 }
    const [sx, sy, vis] = S.project(head(w))
    hud.place(x.id, sx, sy, vis)
  }
  hud.frame()
})
</script>
</body>
</html>
