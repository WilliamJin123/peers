<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peers · sketch rooms</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--hud-bg:#f6f3eae6;--hud-fg:#2b2722;--hud-dim:#7a7266;--hud-line:#dcd5c4;--hud-alert:#e8622c;--hud-font:"Patrick Hand",ui-sans-serif,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#f3efe4}
canvas{position:fixed;left:0;top:0}
.hud{font-size:14px!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import rough from 'https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.esm.js'
import { createSim } from './sim.js'
import { createHud } from './hud.js'

await Promise.all([document.fonts.load('600 20px Caveat'), document.fonts.load('12px "Patrick Hand"')])
const sim = createSim()
const hud = createHud(sim, { title: 'peers · sketch rooms' })
const ALERT = '#e8622c', INK = '#2b2722', PAPER = '#f3efe4', DIM = '#8a7f6c'
const cv = document.getElementById('c'), g = cv.getContext('2d'), rc = rough.canvas(cv)
const tall = innerWidth < innerHeight
addEventListener('resize', () => location.reload())

// one room per session, a caption under each in handwriting; main mailbox below
const N = sim.sessions.length, COLS = tall ? 2 : 3, ROWS = Math.ceil(N / COLS)
const RW = 190, RH = 132, GX = 22, GY = 66
const LW = COLS * RW + (COLS - 1) * GX, LH = ROWS * (RH + GY) + 40
const dpr = Math.min(devicePixelRatio, 2)
cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px'
const top = 48, bot = tall ? 70 : 96
const scale = Math.min((innerWidth - 20) / LW, (innerHeight - top - bot) / LH)
const ox = (innerWidth - LW * scale) / 2, oy = top + (innerHeight - top - bot - LH * scale) / 2
g.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy)
const MAIN = [LW / 2, LH - 18]

const W = {}
sim.sessions.forEach((x, i) => {
  const rx = (i % COLS) * (RW + GX), ry = Math.floor(i / COLS) * (RH + GY)
  const desk = [rx + 112, ry + 86], couch = [rx + 18, ry + 98]
  W[x.id] = { x, rx, ry, desk, couch, pos: null, shake: 0, flash: {} }
})
const spot = (w) => (w.x.state === 'idle' ? [w.couch[0] + 30, w.couch[1] + 4] : [w.desk[0] - 16, w.desk[1] + 30])
for (const id in W) W[id].pos = spot(W[id])
const fly = []
let mainPulse = 0
sim.on((e) => {
  const w = W[e.who] || W[e.from]
  if (e.type === 'commit') fly.push({ kind: 'parcel', a: [w.pos[0], w.pos[1] - 30], b: MAIN, k: 0, c: w.x.color })
  if (e.type === 'msg') fly.push({ kind: 'plane', a: [w.rx + RW / 2, w.ry + 30], b: [W[e.to].rx + RW / 2, W[e.to].ry + 30], k: 0, c: w.x.color })
  if (e.type === 'clash') { const o = W[e.other]; w.shake = o.shake = 1.4; w.flash[e.file] = o.flash[e.file] = 2.4 }
})

let boil = 1
const o = (seed, extra = {}) => ({ seed: seed * 7 + boil, roughness: 1.3, bowing: 1.2, stroke: INK, strokeWidth: 1.3, ...extra })
const WORD = { work: 'working', blocked: 'needs you!', wait: 'waiting…', idle: 'idle' }
let last = performance.now(), acc = 0
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05), T = now / 1000; last = now
  acc += dt; if (acc > 0.16) { acc = 0; boil = (boil % 3) + 1 }
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = PAPER; g.fillRect(0, 0, cv.width, cv.height); g.restore()
  let n = 0
  mainPulse = Math.max(0, mainPulse - dt)
  rc.circle(MAIN[0], MAIN[1], 30 + mainPulse * 14, o(++n, { fill: INK, fillStyle: 'solid', stroke: mainPulse > 0 ? '#6a9bcc' : INK, strokeWidth: 1.5 + mainPulse * 2 }))
  g.font = '600 16px Caveat'; g.fillStyle = PAPER; g.textAlign = 'center'; g.fillText('main', MAIN[0], MAIN[1] + 5)
  for (const id in W) {
    const w = W[id], x = w.x
    if (w.shake > 0) w.shake -= dt
    for (const f in w.flash) w.flash[f] -= dt
    const sx = w.shake > 0 ? Math.sin(T * 50) * 2 : 0
    g.save(); g.translate(sx, 0)
    const { rx, ry } = w
    // room: back wall line, floor line, frame
    const blocked = x.state === 'blocked'
    rc.rectangle(rx, ry, RW, RH, o(++n, { strokeWidth: blocked ? 3 : 1.8, stroke: blocked ? ALERT : INK }))
    rc.line(rx, ry + 64, rx + RW, ry + 64, o(++n, { strokeWidth: 1 }))
    // window
    rc.rectangle(rx + 132, ry + 12, 44, 30, o(++n, { fill: '#cfe3ee', fillStyle: 'hachure', hachureGap: 5, strokeWidth: 1.1 }))
    rc.line(rx + 154, ry + 12, rx + 154, ry + 42, o(++n, { strokeWidth: 1 }))
    // shelf + held files as sheets pinned on the wall
    rc.line(rx + 10, ry + 50, rx + 118, ry + 50, o(++n, { strokeWidth: 1.6 }))
    let fx = rx + 12
    g.font = '11px "Patrick Hand"'
    for (const [f, lines] of x.holds) {
      const h = Math.min(14 + lines / 4, 34), red = w.flash[f] > 0 && Math.sin(T * 14) > 0, focus = f === x.focus
      rc.rectangle(fx, ry + 50 - h, 22, h, o(++n, { fill: x.color, fillStyle: focus ? 'solid' : 'hachure', hachureGap: 3.5, stroke: red ? ALERT : INK, strokeWidth: red ? 3 : 1.1 }))
      fx += 27
    }
    // couch, plant, desk, screen, lamp
    rc.rectangle(w.couch[0], w.couch[1], 60, 20, o(++n, { fill: '#e2d6bd', fillStyle: 'cross-hatch', hachureGap: 6, strokeWidth: 1 }))
    rc.line(w.couch[0], w.couch[1], w.couch[0], w.couch[1] - 12, o(++n)); rc.line(w.couch[0] + 60, w.couch[1], w.couch[0] + 60, w.couch[1] - 12, o(++n))
    const [dx, dy] = w.desk
    rc.line(dx, dy, dx + 66, dy, o(++n, { strokeWidth: 2 }))
    rc.line(dx + 4, dy, dx + 4, dy + 30, o(++n)); rc.line(dx + 62, dy, dx + 62, dy + 30, o(++n))
    const on = x.state === 'work'
    rc.rectangle(dx + 18, dy - 26, 30, 22, o(++n, { fill: on ? x.color : '#d8d0c0', fillStyle: on ? 'solid' : 'hachure', hachureGap: 4 }))
    if (blocked) { const k = Math.sin(T * 6) > 0; rc.circle(rx + RW - 12, ry + 76, 14, o(++n, { fill: k ? ALERT : '#f3d9c6', fillStyle: 'solid', stroke: ALERT })) }
    // person
    const to = spot(w), ddx = to[0] - w.pos[0], ddy = to[1] - w.pos[1], d = Math.hypot(ddx, ddy), sp = 80 * dt
    const moving = d > sp
    w.pos = moving ? [w.pos[0] + (ddx / d) * sp, w.pos[1] + (ddy / d) * sp] : to
    const ph = x.id.charCodeAt(4)
    const [px, py] = w.pos
    if (x.state === 'idle' && !moving) {
      rc.ellipse(px, py - 8, 38, 16, o(++n, { fill: x.color, fillStyle: 'solid', strokeWidth: 1.3 }))
      g.fillStyle = INK; g.beginPath(); g.arc(px + 10, py - 10, 1.4, 0, 7); g.fill()
      g.font = '600 18px Caveat'; g.fillStyle = DIM; g.textAlign = 'left'; g.fillText('z', px + 16, py - 18 - (T * 6 % 6)); g.font = '600 13px Caveat'; g.fillText('z', px + 24, py - 26 - (T * 6 % 6))
    } else {
      const bob = moving ? Math.abs(Math.sin(T * 12 + ph)) * 3 : blocked ? Math.abs(Math.sin(T * 6)) * 4 : 0
      const cy = py - 18 - bob
      rc.ellipse(px, py, 22, 6, o(++n, { stroke: 'none', fill: '#00000020', fillStyle: 'solid' }))
      rc.rectangle(px - 9, cy - 10, 18, 26, o(++n, { fill: x.color, fillStyle: 'solid', strokeWidth: 1.3 }))
      g.fillStyle = INK; g.beginPath(); g.arc(px - 1, cy - 3, 1.5, 0, 7); g.arc(px + 5, cy - 3, 1.5, 0, 7); g.fill()
      if (blocked) rc.line(px + 9, cy - 2, px + 16, cy - 22 + Math.sin(T * 10) * 2, o(++n, { strokeWidth: 2 }))
      else if (x.state === 'work' && !moving) rc.line(px + 9, cy + 6, px + 15 + Math.sin(T * 20 + ph) * 2, cy, o(++n, { strokeWidth: 1.6 }))
      if (blocked) { g.font = '600 24px Caveat'; g.fillStyle = ALERT; g.textAlign = 'left'; g.fillText('!', px + 18, cy - 20 + Math.sin(T * 8) * 2) }
      if (x.state === 'wait') { g.font = '600 20px Caveat'; g.fillStyle = DIM; g.textAlign = 'left'; g.fillText('…', px + 12, cy - 10) }
    }
    g.restore()
    // caption
    g.textAlign = 'left'; g.font = '600 20px Caveat'; g.fillStyle = INK; g.fillText(x.name, rx + 2, ry + RH + 20)
    const nw = g.measureText(x.name).width
    g.font = '15px "Patrick Hand"'; g.fillStyle = blocked ? ALERT : DIM; g.fillText(WORD[x.state], rx + nw + 8, ry + RH + 20)
    g.fillStyle = DIM; g.font = '13px "Patrick Hand"'
    g.fillText([...x.holds.keys()].map((f) => f.split('/').pop()).join(' · ') || 'no files', rx + 2, ry + RH + 38, RW)
    hud.place(id, 0, 0, false)
  }
  for (let i = fly.length - 1; i >= 0; i--) {
    const f = fly[i]; f.k += dt / 1.4
    if (f.k >= 1) { if (f.kind === 'parcel') mainPulse = 1.2; fly.splice(i, 1); continue }
    const [ax, ay] = f.a, [bx, by] = f.b, cx = (ax + bx) / 2, cy = Math.min(ay, by) - 60
    const q = (u) => [(1 - u) ** 2 * ax + 2 * (1 - u) * u * cx + u * u * bx, (1 - u) ** 2 * ay + 2 * (1 - u) * u * cy + u * u * by]
    const pts = []; for (let u = 0; u <= f.k; u += 0.05) pts.push(q(u))
    if (pts.length > 1) { g.setLineDash([4, 5]); rc.curve(pts, o(++n, { stroke: f.c, strokeWidth: 1.4, roughness: 0.6 })); g.setLineDash([]) }
    const [px, py] = q(f.k)
    if (f.kind === 'parcel') rc.rectangle(px - 8, py - 6, 16, 12, o(++n, { fill: '#d8c39c', fillStyle: 'solid' }))
    else { const [qx, qy] = q(Math.min(1, f.k + 0.02)), a = Math.atan2(qy - py, qx - px); rc.polygon([[px + Math.cos(a) * 9, py + Math.sin(a) * 9], [px + Math.cos(a + 2.5) * 7, py + Math.sin(a + 2.5) * 7], [px + Math.cos(a - 2.5) * 7, py + Math.sin(a - 2.5) * 7]], o(++n, { fill: '#fff', fillStyle: 'solid', strokeWidth: 1 })) }
  }
  hud.frame()
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
