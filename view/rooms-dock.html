<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peers · rooms + list</title>
<style>
:root{--hud-bg:#fbf9f4e6;--hud-fg:#2b2722;--hud-dim:#7a7266;--hud-line:#e2dccf;--hud-alert:#e8622c;--hud-font:ui-sans-serif,-apple-system,"Segoe UI",sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#efece4}
canvas{display:block}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import { createSim } from './sim.js'
import { createHud } from './hud.js'
import { createDock } from './dock.js'
import { THREE, stage, clay, box, bean, flights, arc, ease, textPlane, sunlight, pose } from './kit.js'

const sim = createSim()
const hud = createHud(sim, { title: 'peers · rooms' })
const dock = createDock(sim)
const tall = !dock.side
addEventListener('resize', () => location.reload())
const COLS = tall ? 2 : 3, ROWS = Math.ceil(sim.sessions.length / COLS)
const S = stage({ bg: '#efece4', span: tall ? 20.5 : 22, inset: dock.inset })
const { scene } = S
const fly = flights(scene, S.onFrame)
const ALERT = '#e8622c'
sunlight(scene, { r: 20 })

// rooms laid out on the screen grid: right = (1,0,-1), down = (1,0,1)
const RIGHT = new THREE.Vector3(1, 0, -1).normalize(), DOWN = new THREE.Vector3(1, 0, 1).normalize()
const DX = 7.6, DY = 10.5
const mix = (a, b, k) => '#' + new THREE.Color(a).lerp(new THREE.Color(b), k).getHexString()
const R = {}
sim.sessions.forEach((x, i) => {
  const c = i % COLS, r = Math.floor(i / COLS)
  const o = RIGHT.clone().multiplyScalar((c - (COLS - 1) / 2) * DX).add(DOWN.clone().multiplyScalar((r - (ROWS - 1) / 2) * DY - 2))
  const g = new THREE.Group(); g.position.copy(o); scene.add(g)
  const floor = box(4.6, 0.35, 4.6, clay('#e6dccb')); floor.position.y = -0.175; g.add(floor)
  const rug = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.03, 32), clay(mix(x.color, '#ffffff', 0.55))); rug.position.set(0.5, 0.02, 0.6); rug.receiveShadow = true; g.add(rug)
  const wallM = clay(mix(x.color, '#f4efe6', 0.78))
  const wl = box(0.22, 3.2, 4.6, wallM); wl.position.set(-2.19, 1.6, 0); g.add(wl)
  const wr = box(4.6, 3.2, 0.22, wallM); wr.position.set(0, 1.6, -2.19); g.add(wr)
  // window on the back wall
  const win = box(1.3, 0.9, 0.05, clay('#cfe3ee', { emissive: '#cfe3ee', emissiveIntensity: 0.25 })); win.position.set(-0.9, 2.15, -2.06); g.add(win)
  // desk + screen
  const desk = box(2.1, 0.1, 0.9, clay('#c9b597')); desk.position.set(0.7, 1.0, -1.45); g.add(desk)
  for (const [lx, lz] of [[-0.95, -0.35], [0.95, -0.35], [-0.95, 0.35], [0.95, 0.35]]) { const l = box(0.08, 1, 0.08, clay('#b3a284')); l.position.set(0.7 + lx, 0.5, -1.45 + lz); g.add(l) }
  const scr = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.65, 0.07), new THREE.MeshStandardMaterial({ color: '#3a3631', emissive: x.color, emissiveIntensity: 0.3, roughness: 0.5 }))
  scr.position.set(0.7, 1.45, -1.75); scr.castShadow = true; g.add(scr)
  // shelf on the left wall; held files are books
  const shelf = box(0.45, 0.08, 3.4, clay('#b9a586')); shelf.position.set(-1.85, 1.75, 0.1); g.add(shelf)
  const books = new THREE.Group(); books.position.set(-1.85, 1.79, -1.5); g.add(books)
  // alarm lamp + beanbag
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 12), new THREE.MeshStandardMaterial({ color: '#efe6d6', emissive: ALERT, emissiveIntensity: 0 })); lamp.position.set(1.6, 2.85, -2.0); g.add(lamp)
  const bag = new THREE.Mesh(new THREE.SphereGeometry(0.65, 20, 14), clay(mix(x.color, '#3b3630', 0.35))); bag.scale.y = 0.55; bag.position.set(1.3, 0.3, 1.3); bag.castShadow = true; g.add(bag)
  const b = bean(x.color); b.scale.setScalar(1.15); g.add(b)
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.6, 0.76, 40), new THREE.MeshBasicMaterial({ color: ALERT, transparent: true, opacity: 0 })); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.05; b.add(ring)
  R[x.id] = { x, g, b, scr, books, lamp, ring, map: new Map(), spot: 'desk', shake: 0 }
})
// main: a mailbox below the grid
const MAIN = DOWN.clone().multiplyScalar(((ROWS - 1) / 2) * DY + (tall ? 4.6 : 5.6))
const mb = new THREE.Group(); mb.position.copy(MAIN); scene.add(mb)
const post = box(0.2, 1, 0.2, clay('#8e7d63')); post.position.y = 0.5; mb.add(post)
const boxM = clay('#2b2722', { emissive: '#6a9bcc', emissiveIntensity: 0 })
const mbody = box(1.2, 0.8, 0.8, boxM); mbody.position.y = 1.35; mb.add(mbody)
const ml = textPlane('main', { color: '#5b5346', w: 3.4, size: 84, weight: 700 }); ml.position.set(MAIN.x + 0.6, 0.02, MAIN.z + 1.3); scene.add(ml)

const clash = new Map()
function books(w) {
  const { x } = w, keep = new Set(x.holds.keys())
  for (const [f, m] of w.map) if (!keep.has(f)) { w.books.remove(m); w.map.delete(f) }
  let z = 0
  for (const [f, n] of x.holds) {
    let m = w.map.get(f)
    if (!m) { m = box(0.32, 1, 0.24, clay(x.color)); w.books.add(m); w.map.set(f, m) }
    const h = Math.min(0.3 + n / 80, 1.05)
    m.scale.y = h; m.position.set(0, h / 2, z); m.userData.h = h
    m.material.color.set(f === x.focus ? x.color : mix(x.color, '#ffffff', 0.35))
    z += 0.32
  }
}
for (const id in R) books(R[id])
const STAND = { desk: [0.7, -0.55], bag: [0.6, 1.3] }
const at = (w) => (w.x.state === 'idle' ? 'bag' : 'desk')

sim.on((e) => {
  const w = R[e.who] || R[e.from]
  if (e.type === 'edit' || e.type === 'take') { w.scr.material.emissiveIntensity = 1.2; const m = w.map.get(e.file); if (m) m.userData.bump = 1 }
  if (e.type === 'commit') {
    const p = box(0.6, 0.45, 0.6, clay(w.x.color))
    const a = w.g.position.clone().add(new THREE.Vector3(0.7, 1.6, -0.6)), b = MAIN.clone().setY(1.9)
    fly(p, 1.3, (k, o) => { o.position.copy(arc(a, b, ease(k), 5)); o.rotation.y = k * 5 }, () => { boxM.emissiveIntensity = 2; mb.userData.bump = 1 })
  }
  if (e.type === 'clash') {
    clash.set(e.file, Date.now() + 2500)
    const o = R[e.other]; w.shake = o.shake = 1.2
    const a = w.g.position.clone().setY(3.4), b = o.g.position.clone().setY(3.4)
    const geo = new THREE.BufferGeometry().setFromPoints(Array.from({ length: 30 }, (_, i) => arc(a, b, i / 29, 2)))
    const line = new THREE.Line(geo, new THREE.LineDashedMaterial({ color: ALERT, dashSize: 0.3, gapSize: 0.18, transparent: true })); line.computeLineDistances()
    fly(line, 2.4, (k, l) => (l.material.opacity = 1 - k * k))
  }
  if (e.type === 'msg') {
    const plane = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.55, 4), clay('#fffdf8')); plane.castShadow = true
    const a = R[e.from].g.position.clone().setY(2.6), b = R[e.to].g.position.clone().setY(2.6)
    fly(plane, 1.4, (k, o) => { o.position.copy(arc(a, b, ease(k), 3)); o.lookAt(arc(a, b, Math.min(ease(k) + 0.02, 1), 3)); o.rotateX(Math.PI / 2) })
  }
  books(w)
})

S.onFrame((dt, t) => {
  boxM.emissiveIntensity *= 0.95
  const mbb = (mb.userData.bump = Math.max(0, (mb.userData.bump || 0) - dt * 2)); mb.scale.setScalar(1 + Math.sin(mbb * Math.PI) * 0.12)
  for (const id in R) {
    const w = R[id], { x, b } = w
    const [sx, sz] = STAND[at(w)]
    b.position.x += (sx - b.position.x) * Math.min(1, dt * 3); b.position.z += (sz - b.position.z) * Math.min(1, dt * 3)
    const moving = Math.hypot(sx - b.position.x, sz - b.position.z) > 0.08
    b.rotation.y = at(w) === 'desk' && !moving ? Math.PI : moving ? Math.atan2(sx - b.position.x, sz - b.position.z) : Math.PI * 0.75
    if (x.state === 'idle' && !moving) b.position.y = 0.25; else b.position.y = 0
    pose(b, x, t, moving, at(w) === 'desk')
    if (w.shake > 0) { w.shake -= dt; w.g.rotation.y = Math.sin(t * 50) * 0.01 * w.shake } else w.g.rotation.y = 0
    w.ring.material.opacity = x.state === 'blocked' ? 0.55 + Math.sin(t * 6) * 0.35 : 0
    w.lamp.material.emissiveIntensity = x.state === 'blocked' ? 1.8 + Math.sin(t * 6) * 1.2 : 0
    w.scr.material.emissiveIntensity += ((x.state === 'work' ? 0.4 : 0.03) - w.scr.material.emissiveIntensity) * 0.04
    for (const [f, m] of w.map) { const u = m.userData; u.bump = Math.max(0, (u.bump || 0) - dt * 2); m.position.y = u.h / 2 + Math.sin(u.bump * Math.PI) * 0.2 }
    const [hx, hy, hv] = S.project(w.g.position.clone().add(new THREE.Vector3(b.position.x, 2.3, b.position.z)))
    hud.place(id, hx, hy, hv)
  }
  hud.frame()
})
</script>
</body>
</html>
