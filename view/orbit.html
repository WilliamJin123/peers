<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peers · orbit</title>
<style>
:root{--hud-bg:#0b0f1ce6;--hud-fg:#e6ecff;--hud-dim:#8590ad;--hud-line:#222a44;--hud-alert:#ff7a2f;--hud-font:ui-sans-serif,-apple-system,"Segoe UI",sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#070a14}
canvas{display:block}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import { createSim, REPOS, files } from './sim.js'
import { createHud } from './hud.js'
import { THREE, stage, clay, box, flights, arc, ease } from './kit.js'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js'

const sim = createSim()
const hud = createHud(sim, { title: 'peers · orbit' })
const S = stage({ bg: '#070a14', fov: 34, shadows: false })
const { scene, camera, renderer } = S
const fly = flights(scene, S.onFrame)
const ALERT = '#ff7a2f'
const place = () => { const a = innerWidth / innerHeight; camera.position.setLength(a < 1 ? 58 / a : 44) }
camera.position.set(0, 26, 34); place(); addEventListener('resize', place)
const composer = new EffectComposer(renderer)
composer.addPass(new RenderPass(scene, camera))
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.8, 0.45, 0.7))
composer.addPass(new OutputPass())
S.usePost(composer)

scene.add(new THREE.AmbientLight('#8090c0', 0.7))
const sunLight = new THREE.PointLight('#ffe2b0', 2.2, 0, 0); scene.add(sunLight)
// stars
const sg = new THREE.BufferGeometry(), sp = []
for (let i = 0; i < 1400; i++) { const v = new THREE.Vector3().randomDirection().multiplyScalar(90 + Math.random() * 60); sp.push(v.x, v.y, v.z) }
sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3))
scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: '#c8d2ff', size: 0.35, sizeAttenuation: true })))

function sprite(str, { color = '#c6cde6', h = 0.8, weight = 600, font = 'ui-sans-serif,-apple-system,sans-serif' } = {}) {
  const c = document.createElement('canvas'), g = c.getContext('2d'); g.font = `${weight} 56px ${font}`
  c.width = Math.ceil(g.measureText(str).width) + 16; c.height = 72
  g.font = `${weight} 56px ${font}`; g.fillStyle = color; g.textBaseline = 'middle'; g.fillText(str, 8, 38)
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, toneMapped: false, opacity: 0.85 }))
  s.scale.set((h * c.width) / c.height, h, 1)
  return s
}

// the sun is main
const sun = new THREE.Mesh(new THREE.SphereGeometry(1.7, 40, 30), new THREE.MeshBasicMaterial({ color: '#ffe6b8' }))
scene.add(sun)
const corona = new THREE.Mesh(new THREE.RingGeometry(2.1, 2.3, 64), new THREE.MeshBasicMaterial({ color: '#ffcf8a', transparent: true, opacity: 0, side: THREE.DoubleSide }))
scene.add(corona)
const sunL = sprite('main', { color: '#ffe4bb', h: 0.9, weight: 700 }); sunL.position.set(0, -2.6, 0); scene.add(sunL)

const PLANET = { wren: [-9, -4, 1.5, '#b9a68c'], peers: [8, -6, 1.1, '#9fb0a4'], vireo: [-6, 7, 1.0, '#b79e9e'], engine: [9, 5, 1.2, '#a0a3bd'] }
const MOON = {}
const orbits = []
for (const r of REPOS) {
  const [x, z, R, col] = PLANET[r.id]
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g)
  const pl = new THREE.Mesh(new THREE.SphereGeometry(R, 32, 24), clay(col, { roughness: 0.95 })); g.add(pl)
  const path = new THREE.Mesh(new THREE.RingGeometry(Math.hypot(x, z) - 0.02, Math.hypot(x, z) + 0.02, 128), new THREE.MeshBasicMaterial({ color: '#2a3354', side: THREE.DoubleSide }))
  path.rotation.x = -Math.PI / 2; scene.add(path)
  const name = sprite(r.id, { color: '#c9d0ea', h: 1.0, weight: 700 }); name.position.set(0, R + 0.9, 0); g.add(name)
  const fs = files(r.id)
  const spin = new THREE.Group(); g.add(spin)
  orbits.push({ spin, rate: 0.05 + 0.02 * (fs.length % 3) })
  fs.forEach((f, i) => {
    const a = (i / fs.length) * Math.PI * 2, d = R + 1.4 + (i % 2) * 0.7
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.3, 18, 14), new THREE.MeshStandardMaterial({ color: '#59607a', roughness: 0.7, emissive: '#000', emissiveIntensity: 1 }))
    m.position.set(Math.cos(a) * d, Math.sin(i * 1.7) * 0.4, Math.sin(a) * d); spin.add(m)
    const l = sprite(f.split('/').pop(), { color: '#8d97b8', h: 0.42, font: 'ui-monospace,Menlo,monospace' }); l.position.set(0, 0.55, 0); m.add(l)
    MOON[`${r.id}/${f}`] = { m, l, flash: 0 }
  })
}

function paint() {
  const holder = {}
  for (const x of sim.sessions) for (const [f] of x.holds) holder[`${x.repo}/${f}`] = x
  for (const k in MOON) {
    const o = MOON[k], x = holder[k]
    o.m.material.color.set(x ? x.color : '#59607a')
    o.m.material.emissive.set(x ? x.color : '#000')
    o.m.material.emissiveIntensity = x ? (x.focus === k.slice(k.indexOf('/') + 1) ? 1.1 : 0.35) : 0
    o.m.scale.setScalar(x ? 1.25 : 1)
    o.l.material.color.set(x ? '#d6dcf2' : '#8a93b3')
  }
}
paint()

// craft: a small sat per session, docks beside the moon it edits
const C = {}
const lane = {}
for (const x of sim.sessions) {
  const i = (lane[x.repo] = (lane[x.repo] ?? -1) + 1)
  const g = new THREE.Group()
  const bodyM = new THREE.MeshStandardMaterial({ color: '#e8ebf5', roughness: 0.4, metalness: 0.4 })
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.34, 0.5), bodyM))
  const panelM = new THREE.MeshStandardMaterial({ color: x.color, emissive: x.color, emissiveIntensity: 0.7, roughness: 0.4 })
  for (const s of [-1, 1]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.03, 0.3), panelM); p.position.x = s * 0.5; g.add(p) }
  const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 10), new THREE.MeshBasicMaterial({ color: ALERT })); beacon.position.y = 0.3; beacon.visible = false; g.add(beacon)
  const halo = new THREE.Mesh(new THREE.RingGeometry(0.75, 0.86, 40), new THREE.MeshBasicMaterial({ color: ALERT, transparent: true, side: THREE.DoubleSide, opacity: 0 })); g.add(halo)
  scene.add(g)
  const beam = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]), new THREE.LineBasicMaterial({ color: x.color, transparent: true, opacity: 0.8 }))
  scene.add(beam)
  const [px, pz, R] = PLANET[x.repo]
  const park = new THREE.Vector3(px + (i ? 1 : -1) * (R + 0.6), R + 1.1, pz + R + 0.8)
  C[x.id] = { x, g, beacon, halo, beam, panelM, park, target: null, pos: park.clone(), carry: false }
  const first = [...x.holds.keys()][0]
  if (first) C[x.id].target = MOON[`${x.repo}/${first}`]
}
const where = (c) => {
  if (!c.target || c.x.state === 'idle') return c.park
  const w = c.target.m.getWorldPosition(new THREE.Vector3()), [px, , pz] = PLANET[c.x.repo]
  const out = new THREE.Vector3(w.x - px, 0, w.z - pz).normalize()
  return w.add(out.multiplyScalar(0.9)).setY(w.y + 0.5)
}
let flare = 0
sim.on((e) => {
  const c = C[e.who] || C[e.from]
  if (e.type === 'edit' || e.type === 'take') c.target = MOON[`${e.repo}/${e.file}`]
  if (e.type === 'commit') {
    c.target = null
    const rocket = new THREE.Group()
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.45, 12), new THREE.MeshBasicMaterial({ color: '#ffffff' })); nose.rotation.x = Math.PI / 2; rocket.add(nose)
    const fire = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshBasicMaterial({ color: c.x.color })); fire.position.z = -0.3; rocket.add(fire)
    const a = c.pos.clone(), b = new THREE.Vector3(0, 0, 0)
    fly(rocket, 1.6, (k, o) => { o.position.copy(arc(a, b, ease(k), 4)); o.lookAt(arc(a, b, Math.min(1, ease(k) + 0.02), 4)) }, () => (flare = 1))
  }
  if (e.type === 'clash') {
    const o = MOON[`${e.repo}/${e.file}`]; if (!o) return
    o.flash = 2.4
    const wave = new THREE.Mesh(new THREE.RingGeometry(0.4, 0.5, 32), new THREE.MeshBasicMaterial({ color: ALERT, transparent: true, side: THREE.DoubleSide }))
    const at = o.m.getWorldPosition(new THREE.Vector3())
    fly(wave, 1.2, (k, w) => { w.position.copy(at); w.lookAt(camera.position); w.scale.setScalar(1 + k * 4); w.material.opacity = 1 - k })
  }
  if (e.type === 'msg') {
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), new THREE.MeshBasicMaterial({ color: c.x.color }))
    const a = c.pos.clone(), b = C[e.to].pos.clone()
    fly(dot, 1.3, (k, o) => o.position.copy(arc(a, b, ease(k), 3)))
  }
  paint()
})

S.onFrame((dt, t) => {
  for (const o of orbits) o.spin.rotation.y += o.rate * dt
  flare = Math.max(0, flare - dt * 0.9)
  sun.scale.setScalar(1 + flare * 0.25 + Math.sin(t * 2) * 0.02)
  corona.lookAt(camera.position); corona.material.opacity = flare; corona.scale.setScalar(1 + (1 - flare) * 1.5)
  for (const k in MOON) {
    const o = MOON[k]
    if (o.flash > 0) { o.flash -= dt; if (o.flash > 0 && Math.sin(t * 16) > 0) { o.m.material.emissive.set(ALERT); o.m.material.emissiveIntensity = 2 } else if (o.flash <= 0) paint() }
  }
  for (const id in C) {
    const c = C[id], x = c.x
    const goal = where(c)
    c.pos.lerp(goal, Math.min(1, dt * 2.2))
    c.g.position.copy(c.pos).add(new THREE.Vector3(0, Math.sin(t * 2 + id.charCodeAt(4)) * 0.08, 0))
    c.g.lookAt(goal.x === c.park.x ? new THREE.Vector3(0, c.pos.y, 0) : c.target.m.getWorldPosition(new THREE.Vector3()))
    c.g.rotation.z = x.state === 'work' ? Math.sin(t * 3) * 0.15 : 0
    c.panelM.emissiveIntensity = x.state === 'idle' ? 0.08 : x.state === 'wait' ? 0.3 + Math.sin(t * 3) * 0.2 : 0.75
    c.beacon.visible = x.state === 'blocked' && Math.sin(t * 8) > -0.2
    c.halo.lookAt(camera.position); c.halo.material.opacity = x.state === 'blocked' ? 0.5 + Math.sin(t * 6) * 0.35 : 0
    const working = x.state === 'work' && c.target
    c.beam.visible = !!working
    if (working) { const p = c.beam.geometry.attributes.position; const m = c.target.m.getWorldPosition(new THREE.Vector3()); p.setXYZ(0, c.g.position.x, c.g.position.y, c.g.position.z); p.setXYZ(1, m.x, m.y, m.z); p.needsUpdate = true; c.beam.material.opacity = 0.45 + Math.sin(t * 10) * 0.25 }
    const [sx, sy, vis] = S.project(c.g.position.clone().add(new THREE.Vector3(0, 0.5, 0)))
    hud.place(id, sx, sy, vis)
  }
  hud.frame()
})
</script>
</body>
</html>
