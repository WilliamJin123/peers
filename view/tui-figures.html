<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peers · top + figures</title>
<style>
:root{--bg:#0d0e10;--fg:#c9cdd2;--dim:#6b7178;--line:#2a2e33;--alert:#ff7a2f;--ok:#8fd18b;--wait:#e2c46b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:12.5px/1.5 ui-monospace,"SF Mono",Menlo,monospace}
.app{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-rows:auto auto auto 1fr;gap:18px 10px;padding:12px;height:100%}
.bar{grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap;white-space:pre}
.bar b{color:#fff}
.box{border:1px solid var(--line);border-radius:3px;position:relative;padding:12px 10px 8px;min-width:0}
.box>h2{position:absolute;top:-10px;line-height:18px;left:8px;margin:0;padding:0 6px;background:var(--bg);font:inherit;color:var(--dim)}
.box>h2 b{color:var(--fg);font-weight:600}
table{width:100%;border-collapse:collapse}
th{color:var(--dim);font-weight:400;text-align:left;padding:0 10px 2px 0}
td{padding:1px 10px 1px 0;white-space:nowrap;vertical-align:top}
td.files{white-space:normal}
tr.blocked td{background:color-mix(in srgb,var(--alert) 16%,transparent)}
tr.blocked td:first-child{box-shadow:inset 3px 0 var(--alert)}
.st-work{color:var(--ok)} .st-blocked{color:var(--alert);font-weight:700} .st-wait{color:var(--wait)} .st-idle{color:var(--dim)}
.dim{color:var(--dim)}
.f{display:inline-block;margin:0 6px 0 0}
.f.focus{text-decoration:underline}
.map{display:flex;flex-direction:column;gap:6px}
.map .repo{white-space:normal}
.map .repo>span:first-child{color:var(--dim);display:inline-block;width:7ch}
.cell{display:inline-block;margin:0 4px 2px 0;padding:0 3px;border-radius:2px;color:var(--dim);border:1px solid var(--line)}
.cell.held{color:#0d0e10;border-color:transparent}
.cell.clash{background:var(--alert)!important;color:#0d0e10;border-color:var(--alert)}
.log{grid-column:1/-1;min-height:0}
.desks{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.desk{border:1px solid var(--line);border-radius:3px;padding:8px 10px 6px;min-width:0}
.desk.blocked{border-color:var(--alert);background:color-mix(in srgb,var(--alert) 10%,transparent)}
.fig{white-space:pre;font-size:15px;line-height:1.15;margin:2px 0 6px}
.desk .nm{white-space:nowrap;overflow:hidden;text-overflow:clip}
.desk .fs{color:var(--dim);font-size:11px;white-space:normal}
.log div{white-space:pre-wrap;overflow-wrap:anywhere}
.log .alert{color:var(--alert)}
.spark{letter-spacing:1px;color:var(--ok)}
.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
td .why{display:block;font-weight:400}
@media (max-width:760px){.desks{grid-template-columns:1fr 1fr}.fig{font-size:13px}.app{grid-template-columns:1fr;height:auto}.hide-s,thead{display:none}.log{grid-column:auto}tr{display:grid;grid-template-columns:1fr auto;padding:3px 0;border-bottom:1px solid var(--line)}td.files{grid-column:1/-1;padding-left:2ch}}
</style>
</head>
<body>
<div class="app">
  <div class="bar" id="bar"></div>
  <div class="box desks-box" style="grid-column:1/-1"><h2><b>floor</b> pose = state</h2><div class="desks" id="desks"></div></div>
  <div class="box"><h2><b>sessions</b> sorted by who needs you</h2><table><thead><tr><th>session</th><th>state</th><th class="hide-s">task</th><th>holds</th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="box"><h2><b>files</b> by repo · colour = holder</h2><div class="map" id="map"></div></div>
  <div class="box log"><h2><b>log</b> tail -f</h2><div id="log"></div><span class="cur">▌</span></div>
</div>
<script type="module">
import { createSim, REPOS, files, label } from './sim.js'
const sim = createSim()
const $ = (id) => document.getElementById(id)
const WORD = { work: 'working', blocked: 'NEEDS YOU', wait: 'waiting', idle: 'idle' }
const ORDER = { blocked: 0, wait: 1, work: 2, idle: 3 }
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])
const clash = new Map()
const commits = Array(24).fill(0)
let start = Date.now()
const BLK = ' ▁▂▃▄▅▆▇█'
const why = {}
// ascii poses: two frames each
const POSE = {
  work: [[' ┌───┐', ' │▒▒▒│', ' └─┬─┘', '(•_•)⌨ '], [' ┌───┐', ' │▓▒▒│', ' └─┬─┘', '(•_•)⌨.']],
  blocked: [['  !   ', '\\(°o°)/', '  │   ', ' ╱ ╲  '], ['   !  ', ' (°o°)/', '  │   ', ' ╱ ╲  ']],
  wait: [['      ', ' (•_•)', ' ╱│╲ …', ' ╱ ╲  '], ['      ', ' (•_•)', ' ╱│╲ ..', ' ╱ ╲  ']],
  idle: [['    z ', '      ', ' (-_-)', '▄▄▄▄▄▄▄'], ['   Z  ', '    z ', ' (-_-)', '▄▄▄▄▄▄▄']],
}
let fr = 0
function desks() {
  $('desks').innerHTML = sim.sessions.map((x) => {
    const p = POSE[x.state][fr % 2].map((l) => esc(l)).join('\n')
    const fig = x.state === 'work' ? p.replace(/[▒▓]+/g, (m) => `<span style="color:${x.color}">${m}</span>`) : p
    const st = x.state === 'blocked' ? `<span class="st-blocked">NEEDS YOU</span>` : `<span class="st-${x.state}">${WORD[x.state]}</span>`
    const fs = [...x.holds].map(([f]) => `<span style="${f === x.focus ? `color:${x.color}` : ''}">${esc(f.split('/').pop())}</span>`).join(' ')
    return `<div class="desk ${x.state}"><div class="nm"><span style="color:${x.color}">●</span> ${x.name}</div><div class="fig" style="color:${x.state === 'blocked' ? 'var(--alert)' : x.state === 'idle' ? 'var(--dim)' : 'var(--fg)'}">${fig}</div><div>${st}</div><div class="fs">${fs || '—'}</div></div>`
  }).join('')
}
setInterval(() => { fr++; desks() }, 450)

function bar() {
  const c = { work: 0, blocked: 0, wait: 0, idle: 0 }
  for (const x of sim.sessions) c[x.state]++
  const up = Math.floor((Date.now() - start) / 1000)
  const mx = Math.max(1, ...commits)
  $('bar').innerHTML = `<span><b>peers top</b>  up ${Math.floor(up / 60)}:${String(up % 60).padStart(2, '0')}</span><span><b>${sim.sessions.length}</b> sessions</span><span class="st-work"><b>${c.work}</b> working</span>${c.blocked ? `<span class="st-blocked">${c.blocked} NEEDS YOU</span>` : ''}${c.wait ? `<span class="st-wait">${c.wait} waiting</span>` : ''}${c.idle ? `<span class="st-idle">${c.idle} idle</span>` : ''}<span class="dim">commits <span class="spark">${commits.map((n) => BLK[Math.round((n / mx) * 8)]).join('')}</span></span>`
}
function rows() {
  $('rows').innerHTML = [...sim.sessions].sort((a, b) => ORDER[a.state] - ORDER[b.state]).map((x) => {
    const held = [...x.holds].map(([f, n]) => `<span class="f ${f === x.focus ? 'focus' : ''}">${esc(f.split('/').pop())}<span class="dim">:${n}</span></span>`).join('') || '<span class="dim">—</span>'
    const st = x.state === 'blocked' ? `NEEDS YOU <span class="dim why">${esc(why[x.id] || '')}</span>` : WORD[x.state]
    return `<tr class="${x.state}"><td><span style="color:${x.color}">●</span> ${x.name} <span class="dim">${x.id}</span></td><td class="st-${x.state}">${st}</td><td class="hide-s dim">${esc(x.task)}</td><td class="files">${held}</td></tr>`
  }).join('')
}
function map() {
  const holder = {}
  for (const x of sim.sessions) for (const [f] of x.holds) holder[`${x.repo}/${f}`] = x
  $('map').innerHTML = REPOS.map((r) => `<div class="repo"><span>${r.id}</span>${files(r.id).map((f) => {
    const k = `${r.id}/${f}`, h = holder[k], c = clash.get(k) > Date.now()
    return `<span class="cell ${h ? 'held' : ''} ${c ? 'clash' : ''}" ${h ? `style="background:${h.color}"` : ''}>${esc(f.split('/').pop())}${h && h.focus === f ? '*' : ''}</span>`
  }).join('')}</div>`).join('')
}
const log = $('log')
const ts = () => new Date().toTimeString().slice(0, 8)
sim.on((e) => {
  if (e.type === 'clash') clash.set(`${e.repo}/${e.file}`, Date.now() + 2500)
  if (e.type === 'commit') commits[commits.length - 1]++
  if (e.type === 'state' && e.state === 'blocked') why[e.who] = e.why
  const d = document.createElement('div')
  const who = sim.byId[e.who || e.from]
  d.innerHTML = `<span class="dim">${ts()}</span> <span style="color:${who.color}">${e.type.padEnd(6)}</span> ${esc(label(e, sim.byId))}`
  if (e.type === 'clash' || (e.type === 'state' && e.state === 'blocked')) d.className = 'alert'
  log.prepend(d)
  while (log.children.length > (innerWidth < 760 ? 10 : 24)) log.lastChild.remove()
  rows(); map(); bar(); desks()
})
setInterval(() => { commits.shift(); commits.push(0) }, 5000)
setInterval(bar, 1000)
rows(); map(); bar(); desks()
</script>
</body>
</html>
