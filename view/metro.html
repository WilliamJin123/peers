<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peers · metro</title>
<style>
:root{--hud-bg:#fffdf8e6;--hud-fg:#1f1d1a;--hud-dim:#7d776c;--hud-line:#e4ded2;--hud-alert:#e8622c;--hud-font:ui-sans-serif,-apple-system,"Segoe UI",sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#fbfaf6}
svg{position:fixed;left:12px;right:12px;top:48px;bottom:96px;width:calc(100% - 24px);height:calc(100% - 144px)}
.line{fill:none;stroke:#d8d1c2;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.st{stroke-width:2;transition:fill .4s,r .3s}
.lbl{font:500 7.5px ui-sans-serif,-apple-system,sans-serif;fill:#6b655a}
.name{font:700 9px ui-sans-serif,-apple-system,sans-serif;fill:#fff}
.main-t{font:700 8px ui-sans-serif,-apple-system,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
.tr text{font:700 6.5px ui-sans-serif,-apple-system,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
.fly{fill:none;stroke-width:1.4;stroke-dasharray:3 4;animation:d .6s linear infinite}@keyframes d{to{stroke-dashoffset:-14}}
</style>
</head>
<body>
<svg id="svg"></svg>
<script type="module">
import { createSim, REPOS, files } from './sim.js'
import { createHud } from './hud.js'

const sim = createSim()
const hud = createHud(sim, { title: 'peers · metro' })
const ALERT = '#e8622c'
const NS = 'http://www.w3.org/2000/svg'
const el = (tag, a = {}, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p?.append(e); return e }
const svg = document.getElementById('svg')

// octilinear lines out of the main interchange (landscape coords; portrait swaps x/y)
const PATH = {
  wren: [[320, 200], [290, 200], [204, 114], [8, 114]],
  peers: [[320, 200], [320, 124], [396, 48], [560, 48]],
  vireo: [[320, 200], [320, 276], [276, 320], [120, 320]],
  engine: [[320, 200], [424, 200], [474, 250], [616, 250]],
}
const S0 = 74, DEPOT = 38
let tall = false
const P = (x, y) => (tall ? [y, x] : [x, y])
const segs = {}, LEN = {}
for (const r in PATH) {
  let acc = 0
  segs[r] = PATH[r].slice(1).map((b, i) => { const a = PATH[r][i]; const l = Math.hypot(b[0] - a[0], b[1] - a[1]); const s = { a, b, l, at: acc }; acc += l; return s })
  LEN[r] = acc
}
// point + unit normal at arc length s (abstract coords)
function at(r, s) {
  const sg = segs[r].find((g) => s <= g.at + g.l) || segs[r].at(-1)
  const k = Math.max(0, Math.min(1, (s - sg.at) / sg.l))
  const dx = (sg.b[0] - sg.a[0]) / sg.l, dy = (sg.b[1] - sg.a[1]) / sg.l
  return { x: sg.a[0] + dx * k * sg.l, y: sg.a[1] + dy * k * sg.l, nx: -dy, ny: dx, dx, dy }
}
const STS = {} // repo/file → s
for (const r of REPOS) {
  const fs = files(r.id)
  fs.forEach((f, i) => (STS[`${r.id}/${f}`] = S0 + (i * (LEN[r.id] - S0 - 8)) / Math.max(1, fs.length - 1)))
}

let ST = {}, TR = {}, mainRing
const lane = {}
const TRAIN = {}
for (const x of sim.sessions) {
  lane[x.repo] = (lane[x.repo] ?? -1) + 1
  TRAIN[x.id] = { x, s: DEPOT, to: DEPOT, then: null, off: lane[x.repo] * 9 - 4.5, below: lane[x.repo] === 1 }
}
for (const r of REPOS) { const solo = sim.sessions.filter((x) => x.repo === r.id); if (solo.length === 1) TRAIN[solo[0].id].off = 0 }

function build() {
  tall = innerWidth < innerHeight
  svg.setAttribute('viewBox', tall ? '0 0 400 640' : '0 0 640 400')
  svg.replaceChildren()
  ST = {}; TR = {}
  for (const r of REPOS) {
    el('polyline', { class: 'line', points: PATH[r.id].map(([x, y]) => P(x, y).join(',')).join(' ') }, svg)
  }
  for (const r of REPOS) {
    // line badge at the outer end
    const end = at(r.id, LEN[r.id]); const [bx, by] = P(end.x, end.y)
    const g = el('g', {}, svg)
    const w = r.id.length * 6 + 14
    const [ux, uy] = P(end.dx, end.dy)
    const cx = bx + ux * (w / 2 + 10), cy = by + uy * 18
    el('rect', { x: cx - w / 2, y: cy - 8, width: w, height: 16, rx: 8, fill: '#2b2722' }, g)
    el('text', { class: 'name', x: cx, y: cy + 3.5, 'text-anchor': 'middle' }, g).textContent = r.id
    for (const f of files(r.id)) {
      const s = STS[`${r.id}/${f}`]; const p = at(r.id, s); const [x, y] = P(p.x, p.y)
      const c = el('circle', { class: 'st', cx: x, cy: y, r: 4.5, fill: '#fff', stroke: '#8a8478' }, svg)
      const horiz = tall ? Math.abs(p.dx) < 0.1 : Math.abs(p.dy) < 0.1
      const t = el('text', { class: 'lbl', x: x + 6, y: y - 6 }, svg)
      t.textContent = f.split('/').pop()
      if (horiz) t.setAttribute('transform', `rotate(-40 ${x + 6} ${y - 6})`)
      ST[`${r.id}/${f}`] = { c, x, y, flash: 0 }
    }
  }
  const [mx, my] = P(320, 200)
  mainRing = el('circle', { cx: mx, cy: my, r: 15, fill: 'none', stroke: '#2b2722', 'stroke-width': 2, opacity: 0 }, svg)
  el('circle', { cx: mx, cy: my, r: 13, fill: '#2b2722', stroke: '#fff', 'stroke-width': 3 }, svg)
  el('text', { class: 'main-t', x: mx, y: my }, svg).textContent = 'main'
  for (const id in TRAIN) {
    const { x } = TRAIN[id]
    const g = el('g', { class: 'tr' }, svg)
    const sig = el('circle', { r: 11, fill: ALERT, opacity: 0 }, g)
    const body = el('rect', { x: -10, y: -6, width: 20, height: 12, rx: 6, fill: x.color, stroke: '#fff', 'stroke-width': 2 }, g)
    el('text', {}, g).textContent = x.name.split(' ').map((w) => w[0]).join('').toUpperCase()
    TR[id] = { g, sig, body }
  }
  paint()
}

function paint() {
  for (const k in ST) { ST[k].c.setAttribute('fill', '#fff'); ST[k].c.setAttribute('stroke', '#8a8478'); ST[k].c.setAttribute('r', 4.5) }
  for (const x of sim.sessions) for (const [f] of x.holds) {
    const s = ST[`${x.repo}/${f}`]; if (!s) continue
    s.c.setAttribute('fill', x.color); s.c.setAttribute('stroke', '#fff')
    if (f === x.focus) s.c.setAttribute('r', 6.5)
  }
}

function pos(t) {
  const p = at(t.x.repo, t.s)
  return P(p.x + p.nx * t.off, p.y + p.ny * t.off)
}

sim.on((e) => {
  const t = TRAIN[e.who] || TRAIN[e.from]
  if (e.type === 'edit' || e.type === 'take') { t.to = STS[`${e.repo}/${e.file}`]; t.then = null }
  if (e.type === 'commit') { t.to = 0; t.then = () => { mainPulse = 1; t.to = DEPOT } }
  if (e.type === 'state' && e.state === 'idle') t.to = DEPOT
  if (e.type === 'clash') { const s = ST[`${e.repo}/${e.file}`]; if (s) s.flash = 2.6 }
  if (e.type === 'msg') {
    const [ax, ay] = pos(TRAIN[e.from]), [bx, by] = pos(TRAIN[e.to])
    const p = el('path', { class: 'fly', stroke: e.from && sim.byId[e.from].color, d: `M${ax},${ay} Q${(ax + bx) / 2},${Math.min(ay, by) - 50} ${bx},${by}` }, svg)
    setTimeout(() => p.remove(), 1700)
  }
  paint()
})

let mainPulse = 0, last = performance.now()
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now; const T = now / 1000
  const m = svg.getScreenCTM()
  mainPulse = Math.max(0, mainPulse - dt * 1.2)
  mainRing.setAttribute('r', 15 + (1 - mainPulse) * 14 * (mainPulse > 0))
  mainRing.setAttribute('opacity', mainPulse)
  for (const k in ST) {
    const s = ST[k]
    if (s.flash > 0) { s.flash -= dt; const on = s.flash > 0 && Math.sin(T * 16) > 0; s.c.setAttribute('stroke', on ? ALERT : s.c.getAttribute('fill') === '#fff' ? '#8a8478' : '#fff'); s.c.setAttribute('stroke-width', on ? 4 : 2) }
  }
  for (const id in TRAIN) {
    const t = TRAIN[id], r = TR[id]
    const d = t.to - t.s
    if (Math.abs(d) > 0.5) t.s += Math.sign(d) * Math.min(Math.abs(d), (60 + Math.abs(d) * 2.2) * dt)
    else if (t.then) { const f = t.then; t.then = null; f() }
    const [x, y] = pos(t)
    r.g.setAttribute('transform', `translate(${x},${y})`)
    const st = t.x.state
    r.sig.setAttribute('opacity', st === 'blocked' ? 0.35 + Math.sin(T * 6) * 0.3 : 0)
    r.body.setAttribute('stroke', st === 'blocked' ? ALERT : '#fff')
    r.g.style.opacity = st === 'idle' ? 0.45 : 1
    const sp = new DOMPoint(x, y - 8).matrixTransform(m)
    hud.place(id, sp.x, t.below ? sp.y + 38 : sp.y)
  }
  hud.frame()
  requestAnimationFrame(frame)
}
build()
addEventListener('resize', () => { if ((innerWidth < innerHeight) !== tall) build() })
requestAnimationFrame(frame)
</script>
</body>
</html>
