<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peers · task floor</title>
<style>
:root{--hud-bg:#fbf9f4e6;--hud-fg:#2b2722;--hud-dim:#7a7266;--hud-line:#e2dccf;--hud-alert:#e8622c;--hud-font:ui-sans-serif,-apple-system,"Segoe UI",sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#efece3}
canvas{display:block}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import { createSim } from './sim.js'
import { createHud } from './hud.js'
import { createDock } from './dock.js'
import { THREE, stage, clay, box, bean, walk, goTo, flights, arc, ease, textPlane, sunlight, pose, navigate, sign } from './kit.js'

// floor laid out by task: each task a rug, its workers stand on it, its files stand at the back
const sim = createSim()
const hud = createHud(sim, { title: 'peers · task floor' })
const dock = createDock(sim, { tasks: true, tab: 'tasks', onPick: (s) => pick(s, true) })
addEventListener('resize', () => location.reload())
const S = stage({ bg: '#efece3', span: dock.side ? 26 : 26, inset: dock.inset })
const { scene } = S
const fly = flights(scene, S.onFrame)
const ALERT = '#e8622c'
sunlight(scene, { r: 19 })

const ground = box(31, 0.5, 23, clay('#e6dfcf')); ground.position.set(0, -0.25, 0.6); scene.add(ground)
// zones: held tasks centre, blocked left behind a fence, to do right, done along the front
const zl = (s, x, z) => { const l = textPlane(s, { w: 4, size: 60, color: s === 'blocked' ? ALERT : '#9a907f' }); l.position.set(x, 0.02, z); scene.add(l) }
zl('in progress', -4.4, -8.6); zl('blocked', -12.2, -8.6); zl('to do', 10.6, -8.6); zl('done', -12.2, 8.6)
const RW = 5.2, RD = 4.4
const slot = (st, k) => st === 'In Progress' ? [-6 + (k % 3) * 6, -5.2 + Math.floor(k / 3) * 5.6]
  : st === 'Blocked' ? [-12.1, -5.2 + k * 5.6] : st === 'To Do' ? [11.6, -5.8 + k * 3.7] : [-11 + k * 3.6, 10.3]
const scaleOf = (st) => (st === 'In Progress' || st === 'Blocked' ? 1 : st === 'To Do' ? 0.62 : 0.5)

const R = {} // task id -> rug
for (const t of sim.tasks) {
  const g = new THREE.Group()
  const holder = t.holders[0] && sim.byId[t.holders[0]]
  const mat = clay(holder ? holder.color : '#d9d0bd', { transparent: true, opacity: 0.5 })
  const rug = box(RW, 0.06, RD, mat); rug.position.y = 0.03; rug.receiveShadow = true; g.add(rug)
  const edge = box(RW, 0.07, 0.12, clay(holder ? holder.color : '#c9bea8')); edge.position.set(0, 0.035, RD / 2 - 0.06); g.add(edge)
  const a = textPlane(`${t.id}  ${t.title}`, { w: 4.6, size: 44, color: '#3d372f' }); a.position.set(0.2, 0.08, RD / 2 + 0.38); g.add(a)
  // fence + sign for blocked
  const fence = new THREE.Group()
  for (let i = 0; i < 7; i++) { const p = box(0.1, 0.6, 0.1, clay('#c9b898')); p.position.set(-RW / 2 + i * RW / 6, 0.3, -RD / 2); fence.add(p) }
  const rail = box(RW, 0.08, 0.08, clay(ALERT)); rail.position.set(0, 0.5, -RD / 2); fence.add(rail)
  const on = sign(t.on ? `on ${t.on}` : '', { h: 0.5, color: ALERT, bg: '#fbf9f4' }); on.position.set(0, 1.3, -RD / 2); fence.add(on)
  g.add(fence)
  g.userData = { pick: { task: t.id }, mat, edge, fence, to: new THREE.Vector3(), sc: 1, files: new Map(), commits: 0 }
  scene.add(g); R[t.id] = g
}
const hgt = (n) => 0.4 + Math.sqrt(n) * 0.1
function addFile(t, key) {
  const g = R[t], u = g.userData
  if (u.files.has(key)) return u.files.get(key)
  const b = new THREE.Group(), mat = clay('#f6f1e6', { transparent: true })
  const body = box(0.95, 1, 0.95, mat); b.add(body)
  const roof = box(1.02, 0.12, 1.02, clay('#e4dccb')); b.add(roof)
  b.userData = { pick: { file: key }, body, roof, mat, h: hgt(sim.lines.get(key)), shown: 0.05, bump: 0, flash: 0 }
  g.add(b); u.files.set(key, b); placeFiles(t)
  return b
}
function placeFiles(t) {
  let i = 0
  for (const b of R[t].userData.files.values()) { b.position.set(-RW / 2 + 0.7 + (i % 4) * 1.25, 0.06, -RD / 2 + 0.7 + Math.floor(i / 4) * 1.15); i++ }
}
function paint() {
  for (const t of sim.tasks) {
    const u = R[t.id].userData, h = t.holders[0] && sim.byId[t.holders[0]]
    u.mat.color.set(h ? h.color : '#d9d0bd'); u.edge.material.color.set(h ? h.color : '#c9bea8')
    u.mat.opacity = t.status === 'Done' ? 0.25 : h ? 0.42 : 0.5
    u.fence.visible = t.status === 'Blocked'
    for (const [key, b] of u.files) {
      const [repo, ...p] = key.split('/'), f = p.join('/'), x = sim.holderOf(repo, f)
      b.userData.roof.material.color.set(x ? x.color : '#e4dccb')
      b.userData.roof.material.emissive.set(x && x.focus === f ? x.color : '#000000')
      b.userData.roof.material.emissiveIntensity = x && x.focus === f ? 0.4 : 0
    }
  }
}
function layout(snap) {
  const n = {}
  for (const t of sim.tasks) {
    const k = (n[t.status] = (n[t.status] ?? -1) + 1), [x, z] = slot(t.status, k), u = R[t.id].userData
    u.to.set(x, 0, z); u.sc = scaleOf(t.status)
    if (snap) { R[t.id].position.copy(u.to); R[t.id].scale.setScalar(u.sc) }
  }
}
for (const t of sim.tasks) for (const key of t.files) addFile(t.id, key)
layout(true); paint()

// workers: stand at the front of their task's rug; idle ones sit on the front bench
const W = {}
const spot = (x) => {
  const t = x.taskId && sim.taskById[x.taskId]
  if (!t || t.status === 'Done' || !t.holders.includes(x.id)) return new THREE.Vector3(5 + sim.sessions.indexOf(x) * 1.3, 0, 8.9)
  const r = R[t.id].userData.to, i = t.holders.indexOf(x.id)
  return new THREE.Vector3(r.x - 1 + i * 1.3, 0, r.z + 0.7)
}
const bench = box(8.6, 0.45, 0.8, clay('#c4b394')); bench.position.set(8.2, 0.22, 9.8); scene.add(bench)
sim.sessions.forEach((x) => {
  const b = bean(x.color); b.userData.pick = { session: x.id }
  const p = spot(x); b.position.copy(p); scene.add(b)
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.55, 0.72, 40), new THREE.MeshBasicMaterial({ color: ALERT, transparent: true, opacity: 0 }))
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.06; b.add(ring)
  W[x.id] = { x, b, ring, errand: false }
})
const W2 = Object.values(W)
const home = (w) => { const p = spot(w.x); goTo(w.b, p.x, p.z, () => (w.b.rotation.y = Math.PI)) }

let picked = null
function pick(s, fromDock) {
  picked = s
  if (!fromDock) dock.inspect(s)
  const t = s?.task ? s.task : s?.session ? sim.byId[s.session].taskId : s?.file ? sim.tasks.find((k) => k.files.has(s.file))?.id : null
  for (const [id, g] of Object.entries(R)) { const on = !s || id === t; g.userData.mat.opacity = on ? (sim.taskById[id].status === 'Done' ? 0.25 : 0.45) : 0.12; for (const b of g.userData.files.values()) b.userData.mat.opacity = on && (!s?.file || b.userData.pick.file === s.file) ? 1 : 0.3 }
  if (s?.task) nav.flyTo(R[s.task].position.clone().setY(0.5), 2)
  if (s?.session) nav.flyTo(W[s.session].b.position.clone().setY(1), 2)
  if (s?.file && t) nav.flyTo(R[t].userData.files.get(s.file).getWorldPosition(new THREE.Vector3()), 2.4)
}
const tip = (p) => {
  if (p.session) { const x = sim.byId[p.session]; return `<b>${x.name}</b> <span>${x.taskId ?? ''} ${x.task}</span>` }
  if (p.task) { const t = sim.taskById[p.task]; return `<b>${t.id} ${t.title}</b><br><span>${t.status}${t.on ? ` · on ${t.on}` : ''} · ${t.files.size} files · ${t.commits.length} commits</span>` }
  const [repo, ...q] = p.file.split('/'), h = sim.holderOf(repo, q.join('/'))
  return `<b>${p.file}</b><br><span>${sim.lines.get(p.file)} lines · ${h ? `held by ${h.name}` : 'free'}</span>`
}
setTimeout(() => { const q = Object.fromEntries(new URLSearchParams(location.hash.slice(1))); if (Object.keys(q).length) pick(q) }, 1200)
const nav = navigate(S, { pickables: () => [...Object.values(R).flatMap((g) => [...g.userData.files.values()]), ...Object.values(R), ...W2.map((w) => w.b)], onPick: (p) => pick(p), tip })

const head = (w) => w.b.position.clone().add(new THREE.Vector3(0, 1.5, 0))
sim.on((e) => {
  const w = W[e.who] || W[e.from]
  if ((e.type === 'take' || e.type === 'edit') && e.task) addFile(e.task, `${e.repo}/${e.file}`)
  if (e.type === 'edit' && e.task) {
    const b = R[e.task].userData.files.get(`${e.repo}/${e.file}`), u = b.userData
    u.h = hgt(e.lines); u.bump = 1
    const top = b.getWorldPosition(new THREE.Vector3()).setY(u.shown * R[e.task].scale.y + 0.4)
    const t = sign(`+${e.add} −${e.rem}`, { h: 0.34, color: w.x.color, bg: '#fbf9f4' })
    fly(t, 1.5, (k, o) => { o.position.copy(top).setY(top.y + 0.4 + k * 1.1); o.material.opacity = 1 - k * k })
    // hand to file: a sheet hops from the worker to the block
    const a = head(w), sheet = box(0.3, 0.02, 0.38, clay('#fffdf8'))
    fly(sheet, 0.7, (k, o) => { o.position.copy(arc(a, top, ease(k), 1)); o.rotation.z = k * 5 })
  }
  if (e.type === 'clash') { const t = sim.byId[e.other]?.taskId, b = t && R[t].userData.files.get(`${e.repo}/${e.file}`); if (b) b.userData.flash = 2.2 }
  if (e.type === 'msg') {
    const to = W[e.to], a = head(w), b = head(to)
    const plane = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.44, 4), clay('#fffdf8'))
    fly(plane, 1.5, (k, o) => { o.position.copy(arc(a, b, ease(k), 3)); o.lookAt(arc(a, b, Math.min(ease(k) + 0.02, 1), 3)); o.rotateX(Math.PI / 2) })
  }
  if (e.type === 'commit' && e.task) {
    // a sha chip stacks on the rug's front corner
    const g = R[e.task], u = g.userData, chip = box(0.5, 0.12, 0.34, clay(w.x.color))
    const end = new THREE.Vector3(RW / 2 - 0.45, 0.12 + u.commits * 0.13, RD / 2 - 0.4); u.commits++
    const a = head(w)
    fly(chip.clone(), 0.8, (k, o) => { o.position.copy(arc(a, g.localToWorld(end.clone()), ease(k), 1.2)) }, () => { chip.position.copy(end); g.add(chip) })
  }
  if (e.type === 'claim' || e.type === 'close' || e.type === 'take' || e.type === 'commit') paint()
  if (e.type === 'claim' || e.type === 'close') { layout(); setTimeout(() => home(w), 400) }
  if (e.type === 'state' && !w.errand) {
    if (e.state === 'idle') { const p = new THREE.Vector3(5 + sim.sessions.indexOf(w.x) * 1.3, 0, 8.9); goTo(w.b, p.x, p.z) }
    else home(w)
  }
})

S.onFrame((dt, t) => {
  for (const g of Object.values(R)) {
    const u = g.userData
    g.position.lerp(u.to, Math.min(1, dt * 2.5))
    g.scale.setScalar(g.scale.x + (u.sc - g.scale.x) * Math.min(1, dt * 2.5))
    for (const b of u.files.values()) {
      const v = b.userData
      v.shown += (v.h - v.shown) * Math.min(1, dt * 3); v.bump = Math.max(0, v.bump - dt * 2.5)
      v.body.scale.y = v.shown; v.body.position.y = v.shown / 2
      v.roof.position.y = v.shown + 0.05 + Math.sin(v.bump * Math.PI) * 0.15
      if (v.flash > 0) { v.flash -= dt; v.mat.color.set(v.flash > 0 && Math.sin(t * 16) > 0 ? ALERT : '#f6f1e6') }
    }
  }
  for (const w of W2) {
    const moving = walk(w.b, dt)
    pose(w.b, w.x, t, moving, !moving && w.x.state === 'work')
    w.ring.material.opacity = w.x.state === 'blocked' ? 0.55 + Math.sin(t * 6) * 0.35 : 0
    const [sx, sy, vis] = S.project(head(w))
    hud.place(w.x.id, sx, sy, vis)
  }
  hud.frame()
})
</script>
</body>
</html>
