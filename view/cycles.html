<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peers · cycles</title>
<style>
:root{--hud-bg:#070b12e6;--hud-fg:#d8f3ff;--hud-dim:#5f8a9a;--hud-line:#16343f;--hud-alert:#ff7a2f;--hud-font:ui-monospace,"SF Mono",Menlo,monospace}
html,body{margin:0;height:100%;overflow:hidden;background:#04070b}
canvas{position:fixed;left:0;top:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { createSim, REPOS, files } from './sim.js'
import { createHud } from './hud.js'

const sim = createSim()
const hud = createHud(sim, { title: 'peers://grid' })
const ALERT = '#ff7a2f'
const cv = document.getElementById('c'), g = cv.getContext('2d')
// neon: push session colours brighter
const neon = (hex) => {
  const n = parseInt(hex.slice(1), 16), [r, g2, b] = [n >> 16, (n >> 8) & 255, n & 255].map((v) => v / 255)
  const mx = Math.max(r, g2, b), mn = Math.min(r, g2, b), d = mx - mn
  const h = d === 0 ? 0 : mx === r ? ((g2 - b) / d) % 6 : mx === g2 ? (b - r) / d + 2 : (r - g2) / d + 4
  return `hsl(${Math.round(h * 60 + 360) % 360} 90% 62%)`
}
const NEON = Object.fromEntries(sim.sessions.map((x) => [x.id, neon(x.color)]))

const tall = innerWidth < innerHeight
addEventListener('resize', () => { if ((innerWidth < innerHeight) !== tall) location.reload(); else fit() })
const U = 20 // grid unit
const LW = tall ? 360 : 680, LH = tall ? 600 : 380
const ROOMS = tall
  ? { wren: [20, 20, 320, 140], peers: [20, 220, 320, 80], vireo: [20, 360, 320, 80], engine: [20, 480, 320, 100] }
  : { wren: [20, 20, 300, 140], peers: [360, 20, 300, 140], vireo: [20, 220, 300, 140], engine: [360, 220, 300, 140] }
const CORE = tall ? [180, 190] : [340, 190]
let scale = 1, ox = 0, oy = 0
function fit() {
  const dpr = Math.min(devicePixelRatio, 2)
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px'
  const top = 46, bot = 94
  scale = Math.min((innerWidth - 16) / LW, (innerHeight - top - bot) / LH)
  ox = (innerWidth - LW * scale) / 2; oy = top + (innerHeight - top - bot - LH * scale) / 2
  g.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy)
}
fit()

const NODE = {}
for (const r of REPOS) {
  const [x, y, w] = ROOMS[r.id]
  const cols = Math.floor((w - 20) / 60)
  files(r.id).forEach((f, i) => (NODE[`${r.id}/${f}`] = { x: x + 40 + (i % cols) * 60, y: y + 40 + Math.floor(i / cols) * 40, name: f.split('/').pop(), flash: 0, pulse: 0 }))
}
// cycles ride the grid: manhattan legs, horizontal first
const C = {}
const lane = {}
for (const x of sim.sessions) {
  const i = (lane[x.repo] = (lane[x.repo] ?? -1) + 1)
  const [rx, ry, rw, rh] = ROOMS[x.repo]
  const home = [rx + rw - 20 - i * 20, ry + rh]
  const first = [...x.holds.keys()][0]
  const at = first ? [NODE[`${x.repo}/${first}`].x, NODE[`${x.repo}/${first}`].y + 20] : home
  C[x.id] = { x, at: [...at], legs: [], trail: [], home, carry: false, dir: 0 }
}
const route = (c, to, then) => {
  const [ax, ay] = c.at, [bx, by] = to
  // exit up/down to a lane row, run, enter
  c.legs = [[bx, ay], [bx, by]].filter((p, i, a) => !(p[0] === (i ? a[i - 1][0] : ax) && p[1] === (i ? a[i - 1][1] : ay)))
  if (!c.legs.length) c.legs = [[bx, by]]
  c.then = then
}

let coreHit = 0
const pulses = [], sparks = []
sim.on((e) => {
  const c = C[e.who] || C[e.from]
  if ((e.type === 'edit' || e.type === 'take') && !c.carry) { const n = NODE[`${e.repo}/${e.file}`]; route(c, [n.x + (lane[e.repo] && c.home[0] % 40 ? 10 : 0), n.y + 20]); n.pulse = 1 }
  if (e.type === 'commit') { c.carry = true; route(c, [CORE[0], CORE[1]], () => { coreHit = 1; c.carry = false; route(c, c.home) }) }
  if (e.type === 'state' && e.state === 'idle' && !c.carry) route(c, c.home)
  if (e.type === 'clash') {
    const n = NODE[`${e.repo}/${e.file}`]; if (!n) return
    n.flash = 2.4
    for (let i = 0; i < 24; i++) { const a = Math.random() * 6.28, s = 30 + Math.random() * 70; sparks.push({ x: n.x, y: n.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.8 }) }
  }
  if (e.type === 'msg') pulses.push({ a: e.from, b: e.to, k: 0 })
})

let last = performance.now()
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now; const T = now / 1000
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#04070b'; g.fillRect(0, 0, cv.width, cv.height); g.restore()
  // floor grid
  g.lineWidth = 0.5; g.strokeStyle = '#0d1a22'; g.beginPath()
  for (let x = 0; x <= LW; x += U) { g.moveTo(x, 0); g.lineTo(x, LH) }
  for (let y = 0; y <= LH; y += U) { g.moveTo(0, y); g.lineTo(LW, y) }
  g.stroke()
  // districts
  g.font = '600 10px ui-monospace,Menlo,monospace'
  for (const r of REPOS) {
    const [x, y, w, h] = ROOMS[r.id]
    g.shadowBlur = 10; g.shadowColor = '#2fb6d6'; g.strokeStyle = '#1f7f96'; g.lineWidth = 1.2
    g.strokeRect(x, y, w, h); g.shadowBlur = 0
    g.fillStyle = '#4fc3dd'; g.textAlign = 'left'; g.fillText(`/${r.id}`, x + 6, y + 14)
  }
  // core
  coreHit = Math.max(0, coreHit - dt * 0.8)
  g.save(); g.translate(CORE[0], CORE[1])
  g.shadowBlur = 18 + coreHit * 30; g.shadowColor = '#7ef0ff'
  g.strokeStyle = `rgba(126,240,255,${0.6 + coreHit * 0.4})`; g.lineWidth = 2 + coreHit * 2
  for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(0, 0, 10 + i * 5, T * (i % 2 ? -1 : 1) * 1.5 + i, T * (i % 2 ? -1 : 1) * 1.5 + i + 4.2); g.stroke() }
  g.shadowBlur = 0; g.fillStyle = '#bff8ff'; g.textAlign = 'center'; g.font = '700 8px ui-monospace,Menlo,monospace'; g.fillText('main', 0, 3)
  g.restore()
  // file nodes
  const holder = {}
  for (const x of sim.sessions) for (const [f] of x.holds) holder[`${x.repo}/${f}`] = x
  g.font = '7.5px ui-monospace,Menlo,monospace'; g.textAlign = 'center'
  for (const k in NODE) {
    const n = NODE[k], hx = holder[k]
    n.pulse = Math.max(0, n.pulse - dt * 2)
    let col = hx ? NEON[hx.id] : null
    if (n.flash > 0) { n.flash -= dt; if (Math.sin(T * 18) > 0) col = ALERT }
    const s = 7 + n.pulse * 4 + (hx && hx.focus === k.slice(k.indexOf('/') + 1) ? 2 : 0)
    g.shadowBlur = col ? 14 : 0; g.shadowColor = col || '#000'
    g.fillStyle = col || '#0b1a22'; g.strokeStyle = col || '#2c6b7d'; g.lineWidth = 1
    g.fillRect(n.x - s, n.y - s, s * 2, s * 2); g.strokeRect(n.x - s, n.y - s, s * 2, s * 2)
    g.shadowBlur = 0; g.fillStyle = col ? '#e9fbff' : '#4d8797'; g.fillText(n.name, n.x, n.y + 19)
  }
  // trails + cycles
  g.globalCompositeOperation = 'lighter'
  for (const id in C) {
    const c = C[id], x = c.x, col = NEON[id]
    let moving = false
    const leg = c.legs[0]
    if (leg && x.state !== 'blocked') {
      const dx = leg[0] - c.at[0], dy = leg[1] - c.at[1], d = Math.abs(dx) + Math.abs(dy), sp = 120 * dt
      if (d <= sp) { c.at = [...leg]; c.legs.shift(); if (!c.legs.length) { const f = c.then; c.then = null; f?.() } }
      else { c.at[0] += Math.sign(dx) * Math.min(Math.abs(dx), sp); if (!dx) c.at[1] += Math.sign(dy) * Math.min(Math.abs(dy), sp); moving = true; c.dir = Math.atan2(dx ? 0 : Math.sign(dy), dx ? Math.sign(dx) : 0) }
    }
    c.trail.push([c.at[0], c.at[1], T])
    while (c.trail.length && T - c.trail[0][2] > 1.6) c.trail.shift()
    g.lineWidth = 2.2; g.lineCap = 'round'; g.shadowBlur = 12; g.shadowColor = col
    for (let i = 1; i < c.trail.length; i++) {
      const a = c.trail[i - 1], b = c.trail[i]
      if (a[0] === b[0] && a[1] === b[1]) continue
      g.strokeStyle = col; g.globalAlpha = Math.max(0, 1 - (T - b[2]) / 1.6) * 0.9
      g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke()
    }
    g.globalAlpha = x.state === 'idle' ? 0.35 : 1
    g.save(); g.translate(c.at[0], c.at[1]); g.rotate(c.dir)
    g.fillStyle = col; g.shadowBlur = 16
    g.beginPath(); g.moveTo(8, 0); g.lineTo(-6, -4); g.lineTo(-4, 0); g.lineTo(-6, 4); g.closePath(); g.fill()
    if (c.carry) { g.fillStyle = '#fff'; g.fillRect(-3, -2, 4, 4) }
    g.restore()
    if (x.state === 'blocked') {
      g.globalAlpha = 0.5 + Math.sin(T * 6) * 0.4; g.strokeStyle = ALERT; g.shadowColor = ALERT; g.shadowBlur = 20; g.lineWidth = 2
      g.beginPath(); g.arc(c.at[0], c.at[1], 14 + Math.sin(T * 6) * 2, 0, 7); g.stroke()
    }
    if (x.state === 'wait') { g.globalAlpha = 0.6; g.strokeStyle = col; g.setLineDash([2, 3]); g.beginPath(); g.arc(c.at[0], c.at[1], 12, T, T + 4.5); g.stroke(); g.setLineDash([]) }
    g.globalAlpha = 1; g.shadowBlur = 0
    hud.place(id, ox + c.at[0] * scale, oy + (c.at[1] - 12) * scale)
  }
  // messages: a packet along a straight line
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i]; p.k += dt / 1.1
    if (p.k >= 1) { pulses.splice(i, 1); continue }
    const a = C[p.a].at, b = C[p.b].at, col = NEON[p.a]
    g.strokeStyle = col; g.globalAlpha = 0.25; g.lineWidth = 1; g.setLineDash([3, 4]); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); g.setLineDash([])
    g.globalAlpha = 1; g.fillStyle = col; g.shadowBlur = 14; g.shadowColor = col
    g.beginPath(); g.arc(a[0] + (b[0] - a[0]) * p.k, a[1] + (b[1] - a[1]) * p.k, 3, 0, 7); g.fill(); g.shadowBlur = 0
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life -= dt; if (s.life <= 0) { sparks.splice(i, 1); continue }
    s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.94; s.vy *= 0.94
    g.fillStyle = ALERT; g.globalAlpha = s.life / 0.8; g.fillRect(s.x - 1, s.y - 1, 2, 2)
  }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'
  hud.frame()
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
