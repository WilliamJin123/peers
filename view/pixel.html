<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peers · pixel office</title>
<style>
:root{--hud-bg:#241f2ee6;--hud-fg:#f4ead8;--hud-dim:#a89cb4;--hud-line:#4a3f5c;--hud-alert:#ff8a3d;--hud-font:ui-monospace,"SF Mono",Menlo,monospace}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1724}
canvas{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges}
.lbl{position:absolute;font:600 11px ui-monospace,Menlo,monospace;color:#e8dcc4;opacity:.75;letter-spacing:.05em;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { createSim, REPOS } from './sim.js'
import { createHud } from './hud.js'

const sim = createSim()
const hud = createHud(sim, { title: 'peers · pixel office' })
const cv = document.getElementById('c'), g = cv.getContext('2d')
// logical px; portrait stacks the rooms 1×4... kept 2×2 for one map, scaled to fit
const PORTRAIT = innerWidth < innerHeight
const LW = PORTRAIT ? 132 : 240, LH = PORTRAIT ? 336 : 176
cv.width = LW; cv.height = LH
let scale = 1, ox = 0, oy = 0
const fit = () => {
  scale = Math.min((innerWidth - 16) / LW, (innerHeight - 120) / LH)
  scale = scale >= 2 ? Math.floor(scale) : scale
  cv.style.width = `${LW * scale}px`; cv.style.height = `${LH * scale}px`
  ox = (innerWidth - LW * scale) / 2; oy = Math.max(44, (innerHeight - LH * scale) / 2)
  cv.style.left = `${ox}px`; cv.style.top = `${oy}px`
}
const lbls = []
const lbl = (text, x, y) => { const d = document.createElement('div'); d.className = 'lbl'; d.textContent = text; document.body.append(d); lbls.push([d, x, y]) }
const fitLabels = () => { for (const [d, x, y] of lbls) { d.style.left = `${ox + x * scale}px`; d.style.top = `${oy + y * scale}px` } }
addEventListener('resize', () => { if ((innerWidth < innerHeight) !== PORTRAIT) location.reload(); fit(); fitLabels() })
fit()

const ALERT = '#ff8a3d', CLASH = '#ff3d5a'
// portrait: rooms stacked, a hall on the right
const ROOM = PORTRAIT ? { wren: [4, 12], peers: [4, 94], vireo: [4, 176], engine: [4, 258] } : { wren: [6, 14], peers: [126, 14], vireo: [6, 96], engine: [126, 96] }
const RW = 108, RH = 70
const FLOOR = { wren: ['#3d3550', '#433a58'], peers: ['#34405a', '#394662'], vireo: ['#4a3550', '#513a58'], engine: ['#3a4a4a', '#3f5050'] }
const MAIN = PORTRAIT ? [122, 170] : [120, 88], COUCH = PORTRAIT ? [[122, 120], [122, 222]] : [[104, 80], [130, 94]]
for (const r of REPOS) lbl(r.id, ROOM[r.id][0] + 3, ROOM[r.id][1] + RH - 10)
lbl('main', MAIN[0] - 8, MAIN[1] + 5)
fitLabels()

const W = {}
const used = {}
const SLOT = { wren: [[22, 26], [70, 26]], peers: [[46, 26]], vireo: [[46, 26]], engine: [[22, 26], [70, 26]] }
for (const x of sim.sessions) {
  const i = (used[x.repo] = (used[x.repo] ?? -1) + 1)
  const [rx, ry] = ROOM[x.repo], [sx, sy] = SLOT[x.repo][i]
  const desk = [rx + sx, ry + sy]
  W[x.id] = { x, desk, home: [desk[0] + 9, desk[1] - 4], pos: [desk[0] + 9, desk[1] - 4], target: null, path: [], carry: false, flip: false, step: 0, shake: 0, couch: COUCH[i % 2], screen: 0, flash: {} }
}

const msgs = [], fx = []
const goto = (w, p, done) => { w.path = [[p[0], w.pos[1]], p]; w.done = done }
sim.on((e) => {
  const w = W[e.who] || W[e.from]
  if (e.type === 'edit') w.screen = 1
  if (e.type === 'msg') msgs.push({ a: [...w.pos], b: W[e.to], k: 0 })
  if (e.type === 'clash') { const o = W[e.other]; w.shake = o.shake = 1.4; o.flash[e.file] = 2.2; fx.push({ kind: 'clash', a: w, b: o, k: 0 }) }
  if (e.type === 'commit' && !w.carry) {
    w.carry = true
    goto(w, [MAIN[0] + (w.home[0] < MAIN[0] ? -8 : 8), MAIN[1]], () => { w.carry = false; fx.push({ kind: 'drop', k: 0 }); goto(w, w.home) })
  }
  if (e.type === 'state' && !w.carry) {
    if (e.state === 'idle') goto(w, w.couch)
    else goto(w, w.home)
  }
})

const R = (c, x, y, w, h) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h) }

function drawRoom(id) {
  const [x, y] = ROOM[id], [a, b] = FLOOR[id]
  for (let i = 0; i < RW; i += 6) for (let j = 0; j < RH; j += 6) R(((i + j) / 6) % 2 ? a : b, x + i, y + j, 6, 6)
  R('#5c4d78', x, y - 8, RW, 8); R('#6e5d8f', x, y - 8, RW, 2); R('#2a2338', x, y, RW, 1)
  // window strip
  for (let i = 10; i < RW - 10; i += 22) { R('#9fd0e8', x + i, y - 6, 12, 4); R('#c8ecff', x + i, y - 6, 4, 2) }
  // plant
  R('#3f7a4a', x + RW - 9, y + 2, 6, 5); R('#57a05f', x + RW - 8, y + 1, 3, 3); R('#a0644a', x + RW - 8, y + 7, 4, 3)
}

function drawDesk(w, t) {
  const [x, y] = w.desk, s = w.x
  R('#8a5a3c', x, y, 26, 9); R('#a8714c', x, y, 26, 2); R('#5e3d29', x + 1, y + 9, 2, 3); R('#5e3d29', x + 23, y + 9, 2, 3)
  // monitor
  R('#1c1826', x + 3, y - 7, 10, 7); R('#2a2438', x + 7, y, 2, 1)
  const on = s.state === 'work'
  const glow = on ? (w.screen > 0.2 && (t * 20 | 0) % 2 ? '#ffffff' : s.color) : '#2c3a44'
  R(glow, x + 4, y - 6, 8, 5)
  if (on) for (let k = 0; k < 3; k++) R('#ffffff55', x + 5, y - 5 + k * 1.5, 2 + ((t * 3 + k * 7) % 5), 1)
  // lamp: alert when blocked
  R(s.state === 'blocked' && (t * 4 | 0) % 2 ? ALERT : '#c9b28a', x + 22, y - 3, 3, 3)
  // paper stacks = held files
  let i = 0
  for (const [f, n] of s.holds) {
    const h = Math.min(1 + (n / 20) | 0, 6), px = x + 14 + (i % 3) * 3, py = y + 6 - (i > 2 ? 3 : 0)
    const red = w.flash[f] > 0 && (t * 10 | 0) % 2
    R(red ? CLASH : '#f4ead8', px, py - h, 2, h); R(s.color, px, py - h, 2, 1)
    i++
  }
}

function drawGuy(w, t) {
  const s = w.x, [x, y] = w.pos
  const moving = w.path.length > 0
  const bob = moving ? ((t * 10 | 0) % 2) : s.state === 'blocked' ? Math.round(Math.abs(Math.sin(t * 6)) * 2) : 0
  const sx = x + (w.shake > 0 ? ((t * 40 | 0) % 2 ? 1 : -1) : 0), sy = y - bob
  R('#00000044', x - 3, y + 1, 7, 2)
  // body (bean): 7×9
  R(s.color, sx - 3, sy - 9, 7, 9); R('#ffffff33', sx - 2, sy - 8, 2, 3)
  R('#1b1724', sx - 1 + (w.flip ? -1 : 0), sy - 6, 1, 1); R('#1b1724', sx + 1 + (w.flip ? -1 : 0), sy - 6, 1, 1)
  // feet
  const f = moving ? (t * 10 | 0) % 2 : 0
  R('#2a2338', sx - 2, sy, 2, 1 + f); R('#2a2338', sx + 1, sy, 2, 2 - f)
  // arm: raised when blocked, typing when working at desk
  if (s.state === 'blocked') R(s.color, sx + 4, sy - 13 + ((t * 8 | 0) % 2), 2, 5)
  else if (s.state === 'work' && !moving) R(s.color, sx + 3, sy - 4 + ((t * 12 | 0) % 2), 2, 2)
  if (w.carry) { R('#c9a46a', sx - 3, sy - 14, 7, 5); R(s.color, sx - 3, sy - 12, 7, 1) }
  // bubble
  const bubble = s.state === 'blocked' ? ['!', ALERT] : s.state === 'wait' ? ['…', '#f4ead8'] : s.state === 'idle' && !moving ? ['z', '#a89cb4'] : null
  if (bubble) {
    const by = sy - 22 - (s.state === 'blocked' ? Math.round(Math.abs(Math.sin(t * 6)) * 2) : 0)
    R('#f4ead8', sx - 4, by, 9, 8); R('#f4ead8', sx - 1, by + 8, 2, 2)
    // glyphs drawn as pixels: ! … z
    const ink = bubble[1] === '#f4ead8' ? '#241f2e' : bubble[1]
    if (bubble[0] === '!') { R(ink, sx, by + 1, 1, 4); R(ink, sx, by + 6, 1, 1) }
    else if (bubble[0] === '…') for (const k of [-2, 0, 2]) R(ink, sx + k, by + 5, 1, 1)
    else { R(ink, sx - 1, by + 2, 3, 1); R(ink, sx, by + 3, 1, 1); R(ink, sx - 1, by + 4, 1, 1); R(ink, sx - 1, by + 5, 3, 1) }
  }
}

let last = performance.now(), drop = 0
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05), t = now / 1000; last = now
  R('#1b1724', 0, 0, LW, LH)
  for (const r of REPOS) drawRoom(r.id)
  // corridor + main mailbox + couches
  if (PORTRAIT) R('#4f4363', 113, 4, 18, LH - 4)
  else { R('#4f4363', 114, 6, 12, LH - 6); R('#4f4363', 0, 84, LW, 12) }
  R('#2a2338', MAIN[0] - 4, MAIN[1] - 6, 9, 10); R(drop > 0 && (t * 12 | 0) % 2 ? '#ffd27a' : '#8c7aa8', MAIN[0] - 3, MAIN[1] - 5, 7, 3)
  for (const [cx, cy] of COUCH) PORTRAIT ? (R('#7a4a5c', cx - 3, cy - 7, 6, 14), R('#93596f', cx + 2, cy - 7, 3, 14)) : (R('#7a4a5c', cx - 7, cy - 3, 14, 6), R('#93596f', cx - 7, cy - 5, 14, 3))
  drop = Math.max(0, drop - dt)

  const all = Object.values(W)
  for (const w of all) {
    w.screen = Math.max(0, w.screen - dt * 2)
    for (const f in w.flash) w.flash[f] -= dt
    if (w.shake > 0) w.shake -= dt
    if (w.path.length) {
      const [tx, ty] = w.path[0], dx = tx - w.pos[0], dy = ty - w.pos[1], d = Math.hypot(dx, dy), s = 38 * dt
      if (dx) w.flip = dx < 0
      if (d <= s) { w.pos = [tx, ty]; w.path.shift(); if (!w.path.length) { const f = w.done; w.done = null; f?.() } }
      else w.pos = [w.pos[0] + (dx / d) * s, w.pos[1] + (dy / d) * s]
    }
  }
  // draw back to front
  const items = [...all.map((w) => ({ y: w.desk[1] + 10, d: () => drawDesk(w, t) })), ...all.map((w) => ({ y: w.pos[1], d: () => drawGuy(w, t) }))]
  items.sort((a, b) => a.y - b.y).forEach((i) => i.d())

  for (let i = msgs.length - 1; i >= 0; i--) {
    const m = msgs[i]; m.k += dt / 1.3
    if (m.k >= 1) { msgs.splice(i, 1); continue }
    const b = m.b.pos, x = m.a[0] + (b[0] - m.a[0]) * m.k, y = m.a[1] - 12 + (b[1] - m.a[1]) * m.k - Math.sin(Math.PI * m.k) * 20
    R('#f4ead8', x - 3, y - 2, 6, 4); R('#c9b28a', x - 3, y - 2, 6, 1); R('#c9b28a', x - 1, y, 2, 1)
  }
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.k += dt
    if (f.kind === 'drop') { drop = 1; fx.splice(i, 1); continue }
    if (f.k > 2.2) { fx.splice(i, 1); continue }
    if ((t * 8 | 0) % 2) {
      const [ax, ay] = f.a.pos, [bx, by] = f.b.pos
      for (let k = 0; k < 1; k += 0.06) R(CLASH, ax + (bx - ax) * k, ay - 14 + (by - ay) * k, 2, 1)
    }
  }
  for (const w of all) hud.place(w.x.id, ox + w.pos[0] * scale, oy + (w.pos[1] - 25) * scale - 8, true)
  hud.frame()
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
