<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peers · pixel rooms</title>
<style>
:root{--hud-bg:#241f2ee6;--hud-fg:#f4ead8;--hud-dim:#a89cb4;--hud-line:#4a3f5c;--hud-alert:#ff8a3d;--hud-font:ui-monospace,"SF Mono",Menlo,monospace}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1724}
canvas{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges}
.cap{position:absolute;font:11px/1.35 ui-monospace,Menlo,monospace;color:#f4ead8;pointer-events:none}
.cap b{font-weight:700} .cap .d{color:#a89cb4} .cap .st{color:#a89cb4}
.cap.blocked .st{color:var(--hud-alert);font-weight:700}
.cap .fs{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.cap .f{padding:0 3px;background:#2e2840;color:#c9bedb}
.cap .f.on{color:#1b1724}
.cap .f.clash{background:#ff3d5a!important;color:#fff}
@media (max-width:600px){.cap{font-size:10px}.cap .task{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { createSim } from './sim.js'
import { createHud } from './hud.js'

const sim = createSim()
const hud = createHud(sim, { title: 'peers · pixel rooms' })
const cv = document.getElementById('c'), g = cv.getContext('2d')
const tall = innerWidth < innerHeight
addEventListener('resize', () => location.reload())
const ALERT = '#ff8a3d', CLASH = '#ff3d5a'
const R = (c, x, y, w, h) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h) }

// one room per session; caption under each; mailbox "main" below the grid
const N = sim.sessions.length, COLS = tall ? 2 : 3, ROWS = Math.ceil(N / COLS)
const RW = 64, RH = 46, GX = 6, GY = tall ? 30 : 26
const LW = COLS * RW + (COLS - 1) * GX + 8, LH = ROWS * (RH + GY) + 18
cv.width = LW; cv.height = LH
const scale0 = Math.min((innerWidth - 16) / LW, (innerHeight - 110) / LH)
const scale = scale0 >= 3 ? Math.floor(scale0) : scale0
const ox = (innerWidth - LW * scale) / 2, oy = Math.max(42, (innerHeight - 70 - LH * scale) / 2 + 16)
Object.assign(cv.style, { width: `${LW * scale}px`, height: `${LH * scale}px`, left: `${ox}px`, top: `${oy}px` })
const MAIN = [LW / 2, LH - 8]
const tint = (hex, k) => { const n = parseInt(hex.slice(1), 16), c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(v * (1 - k) + 0x1b * k)); return `rgb(${c})` }

const W = {}
sim.sessions.forEach((x, i) => {
  const c = i % COLS, r = Math.floor(i / COLS)
  const rx = 4 + c * (RW + GX), ry = 4 + r * (RH + GY)
  const desk = [rx + 38, ry + 30], couch = [rx + 12, ry + 36]
  const cap = document.createElement('div'); cap.className = 'cap'; document.body.append(cap)
  Object.assign(cap.style, { left: `${ox + rx * scale}px`, top: `${oy + (ry + RH + 2) * scale}px`, width: `${RW * scale}px` })
  W[x.id] = { x, i, rx, ry, desk, couch, pos: x.state === 'idle' ? [couch[0] + 6, couch[1]] : [desk[0] + 10, desk[1] + 13], cap, shake: 0, screen: 0, flash: {}, wall: tint(x.color, 0.72), floor: [tint(x.color, 0.8), tint(x.color, 0.76)] }
})
const spot = (w) => (w.x.state === 'idle' ? [w.couch[0] + 6, w.couch[1]] : [w.desk[0] + 10, w.desk[1] + 13])
const flights = []
let drop = 0
const center = (w) => [w.rx + RW / 2, w.ry + 20]
sim.on((e) => {
  const w = W[e.who] || W[e.from]
  if (e.type === 'edit') w.screen = 1
  if (e.type === 'commit') flights.push({ kind: 'parcel', a: [w.pos[0], w.pos[1] - 12], b: MAIN, k: 0, c: w.x.color })
  if (e.type === 'msg') flights.push({ kind: 'mail', a: center(w), b: center(W[e.to]), k: 0 })
  if (e.type === 'clash') { const o = W[e.other]; w.shake = o.shake = 1.4; o.flash[e.file] = 2.2; w.flash[e.file] = 2.2; flights.push({ kind: 'zap', a: center(w), b: center(o), k: 0 }) }
})

function room(w, t) {
  const { rx, ry, x: s } = w
  const sh = w.shake > 0 ? ((t * 40 | 0) % 2 ? 1 : -1) : 0
  g.save(); g.translate(sh, 0)
  // floor + back wall
  for (let i = 0; i < RW; i += 4) for (let j = 16; j < RH; j += 4) R((i + j) / 4 % 2 ? w.floor[0] : w.floor[1], rx + i, ry + j, 4, 4)
  R(w.wall, rx, ry, RW, 16); R('#14111b', rx, ry + 16, RW, 1)
  R(s.state === 'blocked' ? ALERT : '#2a2338', rx - 1, ry - 1, RW + 2, 1); R('#2a2338', rx - 1, ry + RH, RW + 2, 1); R('#2a2338', rx - 1, ry, 1, RH); R('#2a2338', rx + RW, ry, 1, RH)
  // window
  R('#9fd0e8', rx + 44, ry + 3, 14, 8); R('#c8ecff', rx + 44, ry + 3, 5, 3); R('#2a2338', rx + 50, ry + 3, 1, 8)
  // shelf of held files: book height = lines
  R('#8a5a3c', rx + 3, ry + 12, 36, 2)
  let bx = rx + 4
  for (const [f, n] of s.holds) {
    const h = Math.min(4 + (n / 12 | 0), 9), red = w.flash[f] > 0 && (t * 10 | 0) % 2
    R(red ? CLASH : s.color, bx, ry + 12 - h, 4, h); R('#ffffff40', bx, ry + 12 - h, 1, h)
    if (f === s.focus) R('#ffffff', bx + 1, ry + 12 - h - 2, 2, 1)
    bx += 5
  }
  // couch, plant, lamp (alert when blocked)
  R('#7a4a5c', w.couch[0], w.couch[1] - 2, 16, 5); R('#93596f', w.couch[0], w.couch[1] - 5, 16, 3)
  R('#3f7a4a', rx + 2, ry + 18, 5, 5); R('#57a05f', rx + 3, ry + 17, 3, 3); R('#a0644a', rx + 3, ry + 23, 4, 3)
  const lamp = s.state === 'blocked' && (t * 4 | 0) % 2
  R('#5c4d78', rx + RW - 5, ry + 18, 1, 12); R(lamp ? ALERT : '#c9b28a', rx + RW - 7, ry + 16, 5, 3)
  if (lamp) { g.globalAlpha = 0.25; R(ALERT, rx + RW - 10, ry + 19, 11, 8); g.globalAlpha = 1 }
  // desk + monitor
  const [dx, dy] = w.desk
  R('#8a5a3c', dx, dy, 20, 6); R('#a8714c', dx, dy, 20, 2); R('#5e3d29', dx + 1, dy + 6, 2, 3); R('#5e3d29', dx + 17, dy + 6, 2, 3)
  R('#1c1826', dx + 5, dy - 8, 11, 8); R('#2a2438', dx + 9, dy, 3, 1)
  const on = s.state === 'work'
  R(on ? (w.screen > 0.2 && (t * 20 | 0) % 2 ? '#ffffff' : s.color) : '#2c3a44', dx + 6, dy - 7, 9, 6)
  if (on) for (let k = 0; k < 3; k++) R('#ffffff55', dx + 7, dy - 6 + k * 1.6, 2 + ((t * 3 + k * 7) % 5), 1)
  g.restore()
}

function guy(w, t) {
  const s = w.x, [x, y] = w.pos, to = spot(w), moving = Math.hypot(to[0] - x, to[1] - y) > 0.5
  const bob = moving ? (t * 10 | 0) % 2 : s.state === 'blocked' ? Math.round(Math.abs(Math.sin(t * 6)) * 2) : 0
  const sx = x + (w.shake > 0 ? ((t * 40 | 0) % 2 ? 1 : -1) : 0), sy = y - bob
  R('#00000055', x - 3, y + 1, 7, 1)
  if (s.state === 'idle' && !moving) {
    // lying on the couch
    R(s.color, sx - 6, sy - 5, 10, 5); R('#1b1724', sx + 1, sy - 4, 2, 1)
    const k = (t * 1.5) % 1; g.globalAlpha = 1 - k; R('#a89cb4', sx + 4, sy - 9 - k * 5, 3, 1); R('#a89cb4', sx + 5, sy - 8 - k * 5, 1, 1); R('#a89cb4', sx + 4, sy - 7 - k * 5, 3, 1); g.globalAlpha = 1
    return
  }
  R(s.color, sx - 3, sy - 9, 7, 9); R('#ffffff33', sx - 2, sy - 8, 2, 3)
  R('#1b1724', sx - 1, sy - 6, 1, 1); R('#1b1724', sx + 1, sy - 6, 1, 1)
  const f = moving ? (t * 10 | 0) % 2 : 0
  R('#2a2338', sx - 2, sy, 2, 1 + f); R('#2a2338', sx + 1, sy, 2, 2 - f)
  if (s.state === 'blocked') R(s.color, sx + 4, sy - 13 + ((t * 8 | 0) % 2), 2, 5)
  else if (s.state === 'work' && !moving) R(s.color, sx + 3, sy - 4 + ((t * 12 | 0) % 2), 2, 2)
  if (s.state === 'blocked' || s.state === 'wait') {
    const by = sy - 21
    R('#f4ead8', sx - 4, by, 9, 8); R('#f4ead8', sx - 1, by + 8, 2, 2)
    if (s.state === 'blocked') { R(ALERT, sx, by + 1, 1, 4); R(ALERT, sx, by + 6, 1, 1) }
    else for (const k of [-2, 0, 2]) R('#241f2e', sx + k, by + 5, 1, 1)
  }
}

const WORD = { work: 'working', blocked: 'NEEDS YOU', wait: 'waiting', idle: 'idle' }
const clashOn = (w, f) => w.flash[f] > 0
let last = performance.now(), lastCap = 0
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05), t = now / 1000; last = now
  R('#1b1724', 0, 0, LW, LH)
  drop = Math.max(0, drop - dt)
  // mailbox
  R('#5c4d78', MAIN[0] - 1, MAIN[1] - 3, 2, 6); R('#2a2338', MAIN[0] - 5, MAIN[1] - 9, 11, 7); R(drop > 0 && (t * 12 | 0) % 2 ? '#ffd27a' : '#8c7aa8', MAIN[0] - 4, MAIN[1] - 8, 9, 2)
  for (const id in W) {
    const w = W[id]
    w.screen = Math.max(0, w.screen - dt * 2); if (w.shake > 0) w.shake -= dt
    for (const f in w.flash) w.flash[f] -= dt
    const to = spot(w), dx = to[0] - w.pos[0], dy = to[1] - w.pos[1], d = Math.hypot(dx, dy), sp = 30 * dt
    w.pos = d <= sp ? to : [w.pos[0] + (dx / d) * sp, w.pos[1] + (dy / d) * sp]
    room(w, t); guy(w, t)
    hud.place(id, 0, 0, false)
  }
  for (let i = flights.length - 1; i >= 0; i--) {
    const f = flights[i]; f.k += dt / (f.kind === 'zap' ? 2.2 : 1.3)
    if (f.k >= 1) { if (f.kind === 'parcel') drop = 1.2; flights.splice(i, 1); continue }
    if (f.kind === 'zap') { if ((t * 8 | 0) % 2) for (let k = 0; k < 1; k += 0.05) R(CLASH, f.a[0] + (f.b[0] - f.a[0]) * k, f.a[1] + (f.b[1] - f.a[1]) * k, 2, 1); continue }
    const x = f.a[0] + (f.b[0] - f.a[0]) * f.k, y = f.a[1] + (f.b[1] - f.a[1]) * f.k - Math.sin(Math.PI * f.k) * 16
    if (f.kind === 'parcel') { R('#c9a46a', x - 3, y - 2, 7, 5); R(f.c, x - 3, y, 7, 1) }
    else { R('#f4ead8', x - 3, y - 2, 6, 4); R('#c9b28a', x - 3, y - 2, 6, 1); R('#c9b28a', x - 1, y, 2, 1) }
  }
  if (t - lastCap > 0.25) {
    lastCap = t
    for (const id in W) {
      const w = W[id], x = w.x
      const fs = [...x.holds].map(([f, n]) => `<span class="f ${f === x.focus ? 'on' : ''} ${clashOn(w, f) ? 'clash' : ''}" ${f === x.focus ? `style="background:${x.color}"` : ''}>${f.split('/').pop()}</span>`).join('')
      const html = `<div><b style="color:${x.color}">${x.name}</b> <span class="st">${WORD[x.state]}</span></div><div class="d task">${x.task}</div><div class="fs">${fs}</div>`
      w.cap.classList.toggle('blocked', x.state === 'blocked')
      if (w.cap.innerHTML !== html) w.cap.innerHTML = html
    }
  }
  hud.frame()
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
