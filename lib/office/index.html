<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Peers office</title>
<link rel="preload" href="../vendor/fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
<link rel="modulepreload" href="../vendor/three/three.module.min.js">
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.min.js","three/addons/":"../vendor/three/addons/"}}</script>
<style>
@font-face{font-family:"Fredoka";src:url(../vendor/fonts/fredoka.woff2) format("woff2");font-weight:300 700;font-display:swap}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#ffe2c6,#ffd0d6,#d6d0ff);-webkit-tap-highlight-color:transparent}
canvas{display:block;touch-action:none;outline:none}
body.no-gl{overflow:auto}
</style>
</head>
<body>
<noscript><p style="font:15px system-ui;padding:24px">The peers office needs JavaScript. The plain list is at <a href="../">peers view</a>.</p></noscript>
<script type="module">
import { theme } from './theme.js'
import { office } from './office.js'

// mode: ?demo[=empty|many] forces the demo; else live when the peers view server answers, demo when it does not (Pages)
const q = new URLSearchParams(location.search)
document.documentElement.style.cssText += theme.css
const ping = async () => {
  try {
    const r = await fetch('../api/ping', { cache: 'no-store', signal: AbortSignal.timeout(1500) })
    return r.ok && (await r.json()).app === 'peers'
  } catch { return false }
}
const live = !q.has('demo') && (await ping())
const feed = live
  ? (await import('./live.js')).createLive({ only: q.getAll('only') })
  : (await import('./demo.js')).createDemo(q.get('demo') || 'story')
office(feed, theme)
</script>
</body>
</html>
